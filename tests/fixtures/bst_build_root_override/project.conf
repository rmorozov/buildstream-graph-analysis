# UX-80: a project that overrides `build-root`, which is what the
# sandbox->element attribution needs in order to fail.
#
# BuildStream's default build root embeds the element name, so Plane 2's
# path-convention fallback happens to tag every process correctly - which
# is why every other fixture and example in this repository joins cleanly
# and why UX-56's collapse was invisible here. `freedesktop-sdk`, the
# project the real-project guide is written from, overrides it; 99.4% of
# its traced processes landed in one `buildstream-build` bucket.
#
# One element, one command, no toolchain: this fixture exists to prove
# the *attribution path*, not to be a realistic build.
name: build-root-override-test
min-version: 2.0
element-path: elements

variables:
  # The override. Anything that does not contain the element name will
  # do; this shape mirrors what real projects use.
  build-root: /buildstream-build
