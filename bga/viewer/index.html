<!DOCTYPE html>
<!--
  UX-193. This page is checked into the repository and served as-is:
  no bundler, no npm, no build step. If you are reading it in a browser
  devtools pane, you are reading the same bytes that are in git.

  It renders the *schema*, not the report - see app.js.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bga report</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- UX-317 (styleguide §2b.2): the header carries **identity only** -
     what this run is, within a stated vertical budget. Three lines,
     and `tests/unit/test_apparatus_in_its_place.py` holds them: the
     save-the-trace sentence used to render here, two blocks above the
     control it explains, and it "occupies precious vertical height"
     before the reader has seen a single number. -->
<header>
  <h1 id="run-name">bga</h1>
  <p id="run-path" class="muted"></p>
  <!-- UX-255: which build measured this run (UX-249's producer stamp).
       Hidden until app.js has a payload to fill it from, so a page that
       failed to load never shows a heading that claims something. -->
  <p id="run-producer" class="muted" hidden></p>
</header>
<!-- UX-317 (styleguide §2b.1): **a control's explanation lives with the
     control.** The Perfetto button, the link that works when the pop-up
     does not, and the file to drag into Perfetto yourself are one group
     because they are one decision - how do I get this trace open - and
     nothing here explains a control from under a different heading. -->
<div id="actions-group" class="actions-group">
  <p id="actions" hidden>
    <button id="perfetto">Open timeline in Perfetto</button>
    <a href="sql.html">Questions to ask it</a>
    <span id="handoff" class="muted"></span>
  </p>
  <!-- UX-198: pop-up policy will change again, so there is always a
       plain link. Unhidden only when a server is behind the trace. -->
  <p id="actions-fallback" class="muted" hidden>
    Nothing opened? <a id="perfetto-link" href="#">open ui.perfetto.dev
    with this trace</a>.
  </p>
  <!-- UX-314: the transport that needs no permission from anybody.
       Perfetto's connect-src decides whether the deep link may be
       used, and postMessage has a size ceiling, so the reader always
       has the file itself and Perfetto's own drag-and-drop.
       UX-317: and it renders here, under the control it explains,
       rather than in the header two blocks above it. -->
  <p id="actions-download" class="muted" hidden>
    Or <a id="trace-download" href="#" download>save the trace</a> and
    drag it into <span class="mono">ui.perfetto.dev</span>.
  </p>
</div>
<main id="report" aria-busy="true">
  <p class="muted">Loading…</p>
</main>
<footer class="muted">
  <p>Rendered from this run's published JSON — the same document
     <code>bga analyze --format json</code> prints.
     <a href="report.json">report.json</a> ·
     <a href="schemas.json">schemas.json</a></p>
</footer>
<script type="module" src="app.js"></script>
</body>
</html>
