# UX-755: BuildStream's own `reserved-disk-space` default (5%) reads
# `shutil.disk_usage(volume).total`, not `.free` - on a host whose real
# free space is small next to its nominal filesystem size, the reserve
# alone can exceed what is actually free, refusing any build with
# "Cache too full" before a process runs. Absolute values sidestep the
# percentage-of-total arithmetic entirely. `bst` 2.x reads this file
# name first (falling back to `buildstream.conf`); both are kept
# identical here so either bst major version picks it up.
cache:
  quota: 3G
  reserved-disk-space: 500M
