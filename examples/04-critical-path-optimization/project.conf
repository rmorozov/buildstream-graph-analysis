# Real BuildStream project demonstrating an iterative optimization
# workflow using `bga`'s own output to guide each step (docs/backlog/scenarios/
# UX-05). Deliberately structured with two distinct, independently
# discoverable optimization opportunities:
#   1. A scheduling bottleneck - four independent libraries (lib-a..d)
#      fan out from core.bst; built with a constrained builder count,
#      this produces real RESOURCE_WAIT/SCHEDULER_WAIT gaps.
#   2. A structural/critical-path bottleneck - an unnecessarily split
#      two-step "prepare" prelude (base-config.bst -> base-generate.bst)
#      and a single unnecessarily slow, high-blast-radius core.bst
#      (5 downstream elements: lib-a..d + app).
#
# See docs/guides/optimization-walkthrough.md for the real before/after numbers
# from actually working through both opportunities, and optimized/ for
# the resulting project after fixing the structural one - built and
# compared against this project via `bga compare` as the walkthrough's
# own worked example (the scheduling fix needs no project change, just
# a different --builders value against this same project).
#
# All sources are `kind: local` (no network access needed). files/runtime/
# bin's shell binaries are populated at build time by
# examples/stage_runtimes.sh, not committed - see that script.
name: critical-path-optimization-example
min-version: 2.0
element-path: elements
