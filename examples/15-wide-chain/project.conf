# UX-1132: a chain of wide elements (wide-1 -> wide-2 -> wide-3 ->
# wide-4), each 128 generated C units - at every moment one element is
# ready and nothing else is, so its own width is the whole host's.
# Same staged sysroot and generator as 11/13 (stage_cpp_toolchain.sh
# hardlink-clones both in).
options:
  unit_lines:
    type: enum
    description: generate.sh's line count per generated C unit, every chain element
    values:
    - '1800'
    - '9800'
    default: '9800'
    variable: unit_lines

name: wide-chain-example
min-version: 2.0
element-path: elements

plugins:
- origin: pip
  package-name: buildstream-plugins
  elements:
  - cmake
