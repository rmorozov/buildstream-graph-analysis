# A deliberately minimal project whose only purpose is to exercise
# UX-46's declared-vs-used dependency detection in BOTH directions.
#
# `examples/06-macro-micro-optimization` cannot do that: UX-46 measured
# it and found that *every* cross-element build dependency in that
# project is decorative, so its only true-negative evidence was
# `toolchain.bst`. A detector that reported everything as unused would
# have looked identical on that project.
#
# Here, `user.bst` and `unrelated.bst` declare the *same* dependencies
# (`base.bst` + `toolchain.bst`) and differ in exactly one respect:
# `user.cpp` does `#include <base.hpp>`, resolving to base.bst's staged
# header, and `unrelated.cpp` includes nothing. A correct detector must
# separate them; an over-eager one flags both, and an inert one flags
# neither.
name: dep-usage-example
min-version: 2.0
element-path: elements

plugins:
- origin: pip
  package-name: buildstream-plugins
  elements:
  - cmake
