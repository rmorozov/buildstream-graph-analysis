# Real BuildStream project building real C/C++ code through CMake +
# GNU Make (docs/scenarios/UX-05's second round - a more realistic
# workload than examples/04's `sleep N` proxy, specifically to test
# whether BuildStream's `--builders` and each cmake/make element's own
# `%{max-jobs}` (real native-build-system parallelism, propagated by
# buildstream-plugins' cmake.yaml as `-j%{max-jobs}`) genuinely compete
# for the same CPU cores - see docs/scenarios/UX-09-builders-max-jobs-
# joint-optimization.md for the real evidence this project was built to
# demonstrate.
#
# Topology mirrors examples/04's shape (a real critical-path bottleneck +
# a real 4-way fan-out) but every element does real, tunable-by-source-
# size gcc/g++ compilation (files/generate_sources.py), not sleep:
#   toolchain.bst - a full, real gcc/g++/cmake/make/binutils sysroot
#     staged from THIS HOST's own installed packages (examples/
#     stage_cpp_toolchain.sh - no docker/debootstrap/network image pull
#     needed; see that script's own header for why and the real
#     trial-and-error it took to get a working sandboxed toolchain).
#   core.bst - highest-blast-radius module (5 downstream: lib-a..d +
#     app), deliberately the most source files (heaviest single compile).
#   lib-a.bst..lib-d.bst - four independent libraries depending on
#     core.bst - the real 4-way fan-out.
#   app.bst - links all four libraries + core into a real executable.
#
# All sources are `kind: local` (generated once by generate_sources.py
# and committed, like every other example's convention - no python
# needed inside the sandbox at build time).
name: cmake-cpp-toolchain-example
min-version: 2.0
element-path: elements

plugins:
- origin: pip
  package-name: buildstream-plugins
  elements:
  - cmake
