# UX-1082: a project option that changes an element's resolved
# variable (`-o variant b`), so two builds of the same target record
# different cache keys - the two-variant case the Acceptance Test asks
# for. No network needed: `manual`, `install-commands: ["true"]`.
name: bst-option-project
min-version: 2.0
element-path: elements
options:
  variant:
    type: enum
    description: which variant this build is
    values:
    - a
    - b
    default: a
    variable: variant
