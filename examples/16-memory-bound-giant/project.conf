# UX-1132: one giant whose units are memory-heavy - 32 generated C units
# of `mem_lines` lines each; cc1's peak RSS grows ~6.6 MB per 1000 lines
# at the default -O0 (this host: 40000 -> 284 MB, 80000 -> 549 MB), so a
# pool as wide as the cores oversubscribes RAM and PSI's memory bound
# withdraws tokens. `graviton_arms.sh memgiant` picks the rung from the
# host's MemTotal/nproc. Same sysroot and generator as 11/13.
options:
  mem_lines:
    type: enum
    description: generate.sh's line count per generated C unit, i.e. cc1's peak RSS
    values:
    - '80000'
    - '160000'
    - '240000'
    - '320000'
    - '480000'
    default: '240000'
    variable: mem_lines

name: memory-bound-giant-example
min-version: 2.0
element-path: elements

plugins:
- origin: pip
  package-name: buildstream-plugins
  elements:
  - cmake
