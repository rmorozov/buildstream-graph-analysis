# The optimized variant of ../ - see that project.conf for the three
# deliberate inefficiencies this one fixes:
#
#   1. MACRO / graph shape: lib-a..lib-f are a six-wide fan-out off
#      core.bst, not a six-deep chain.
#   2. MACRO / over-declared dependency: only lib-f.bst depends on
#      codegen.bst - the five elements that never used it no longer wait
#      for it.
#   3. MICRO / inside one element: core.bst no longer carries
#      `notparallel: True`, so its eight translation units compile at
#      the project's real `--max-jobs` instead of one at a time.
#
# Every source file, element kind, and build command is byte-identical
# to ../ - `files` is a symlink to the parent project's own files/ so
# the two variants provably build the same code. The only differences
# are the three above, all of them one-line declarations.
name: macro-micro-optimization-example-optimized
min-version: 2.0
element-path: elements

plugins:
- origin: pip
  package-name: buildstream-plugins
  elements:
  - cmake
