name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# UX-197: every job here installs the dev extras, so every job should
# *fail* rather than skip if one of them is missing. Without this the
# schema guards (UX-190, 25 of them) rendered as a single "1 skipped"
# line whenever `jsonschema` was absent - real in CI, silent everywhere
# else, which is backwards for a guard against schema drift.
env:
  BGA_EXPECT_DEV: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml's own classifiers declare 3.9-3.12 as supported -
        # matrix across all four rather than pinning to one (P4-06).
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check no build artifacts are tracked
        run: make check-clean

      - name: Lint
        run: make lint

      # UX-238: the small tier is the inner loop's tier, and its value is
      # that it stays fast. Nothing stops a slow test landing in it -
      # it is the *default*, so a new file joins it silently - which is
      # why the budget is enforced here rather than trusted.
      #
      # UX-363: re-measured 2026-08-29 across all four interpreters -
      # 17.3-25.9s on this step; 31s was the bound. Round 66 met a
      # slower runner still (29s on 3.9, run 33303144837) and the bound
      # is 32s. It is sized so that one *large* file landing in the
      # UX-421: this is a BACKSTOP, not a budget. It catches a hang and
      # nothing finer. A wall-clock step timeout cannot separate a
      # runner four seconds slower than its siblings from a fifteen-
      # second file in the default tier - round 66 proved it, with 3.9
      # killed at 30s while 3.10, 3.11 and 3.12 passed the same step on
      # the same commit. The job it used to claim belongs to the
      # "Tiers match CI's own record of them" step below, which divides
      # the runner out first and names the file. Keep in step with
      # SMALL_TIER_BACKSTOP_S in tests/tiers.py.
      - name: Test (small tier, with a backstop)
        run: timeout 120 make test-small

      # UX-420: one interpreter writes a report, because one is enough
      # to read this runner against its own past and four would be four
      # references to keep true.
      - name: Test
        run: make test
        if: matrix.python-version != '3.11' && matrix.python-version != '3.12'

      # UX-524: the touching map, measured rather than grepped. Coverage
      # with `--cov-context=test` records which test files executed
      # which module lines - the import chain `dev_touching`'s grep
      # cannot see, which is the class `UX-500`'s round could not close.
      #
      # On 3.12 and never on 3.11: measured at **+20%** wall clock
      # (33.2s -> 40.0s on a twelve-file subset here), and 3.11 is the
      # interpreter whose seconds `UX-503`'s reference is made of. A
      # timing record taken under coverage would move every row in it.
      - name: Test (with a coverage-derived touching map)
        run: |
          make test PYTEST_ARGS="--cov=bga --cov=tools \
            --cov-context=test --cov-report="
        if: matrix.python-version == '3.12'

      - name: Test (with a timing report)
        run: make test PYTEST_ARGS="--junitxml=${{ runner.temp }}/junit.xml"
        if: matrix.python-version == '3.11'

      # `UX-554`: the steps below read the junit and run only when the
      # suite passed, so on the one run where it matters the record of
      # *what* failed died with the runner. Round 81 could not name
      # four red jobs. `always()` keeps it; the tail line keeps the
      # first id legible when the log is truncated, which is `UX-491`'s
      # rule applied to the path where the gate does not run.
      - name: The failing tests, named
        if: failure() && matrix.python-version == '3.11'
        run: |
          python tools/dev_junit_tail.py "${{ runner.temp }}/junit.xml"

      - name: Keep the junit whatever the suite did
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: junit-3.11
          path: ${{ runner.temp }}/junit.xml
          retention-days: 30
          if-no-files-found: warn

      # UX-418 established that CI's seconds cannot be compared to the
      # floors in tests/tiers.py, which describe a developer machine:
      # a fixed slack, a scale derived from the report and a rank
      # comparison each reported files that had not drifted, because the
      # two runners differ *per file* rather than by a factor.
      #
      # UX-420 is what is left standing - CI against its own recorded
      # numbers, one machine against itself over time. The reference is
      # tests/ci_reference.json; the run's median shift is divided out
      # first, so a new runner image is not read as every file drifting.
      # `make test-tiers` remains the developer-side check against the
      # floors, where those seconds mean something.
      #
      # `UX-442`: the step is given a memory. One CI run cannot tell a
      # file that got slower from a file that had a slow afternoon -
      # round 69 was stopped three times by this step, none of them by
      # a test, one of them by a single 13.9s sample of a file whose
      # other three samples were 7.1-7.5s. So a file is reported only
      # when consecutive runs agree, and the carry file is where a run
      # leaves its finding for the next one. Keyed by ref, so a branch
      # reads its own series and not another branch's.
      - name: What the last run of this branch found over the gates
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/tier_carry.json
          key: tier-carry-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            tier-carry-${{ github.ref }}-
        if: matrix.python-version == '3.11'

      # UX-476: `--base` is the other half of the rule. Two runs read
      # against one recording run are one measurement counted twice, so
      # confirming a file needs something in the diff that could account
      # for it - `tools/dev_touching.select`, over `origin/<default>`.
      # The checkout is shallow, so the base is fetched here; a fetch
      # that fails leaves no base, and the tool then decides on
      # agreement alone, which is exactly what it did before.
      - name: The branch's own diff, so a reported file can have a cause
        run: |
          git fetch --no-tags --depth=200 origin \
            "${{ github.event.repository.default_branch }}" || true
        if: always() && matrix.python-version == '3.11'
        continue-on-error: true

      - name: Tiers match CI's own record of them
        run: |
          python tools/dev_tier_drift.py "${{ runner.temp }}/junit.xml" \
            --against --carry "${{ runner.temp }}/tier_carry.json" \
            --base "origin/${{ github.event.repository.default_branch }}" \
            --summary "${{ runner.temp }}/tier_gate.txt" \
            --source "github-actions ubuntu-latest, test (3.11), -n auto"
        if: matrix.python-version == '3.11'

      # `always()`, because the run this most needs to remember is the
      # one that just reported - and the step above exits 1 on it.
      - name: Leave it for the next run
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/tier_carry.json
          key: tier-carry-${{ github.ref }}-${{ github.run_id }}
        if: always() && matrix.python-version == '3.11'

      # UX-427: the half of UX-420's design that was missing. The
      # reference can be *recorded* - `--record` writes it - but nothing
      # put CI's own report where a contributor could record from it,
      # and UX-418 established that a local report cannot stand in. So
      # the step above could say "re-record with --record and commit"
      # while nobody had the numbers to do it, and the reference went
      # stale the first time a round added a file. Round 68 met that:
      # two files added in round 67 were absent, and one of them crossed
      # the medium floor here and started reporting.
      #
      # This prints the refreshed document on every run, so refreshing
      # is a copy rather than a guess. `always()` because the step above
      # fails the job precisely when the refresh is wanted.
      # `UX-441`: to a **file**, not to stdout. `if: always()` is right -
      # a red run's timings are still timings, and gating the record on
      # success would lose exactly the runs worth re-recording from. But
      # the document is one line per test file, and printed here it
      # trailed the failure it followed: on two reds this round the tail
      # of this job's log was 370 lines of reference and the failing
      # assertion was out of reach. `--record PATH` writes the file and
      # prints one line, so the failure stays the last thing in the log
      # and the document is still a click away.
      - name: This run's timings, for refreshing the reference
        run: |
          python tools/dev_tier_drift.py "${{ runner.temp }}/junit.xml" \
            --record "${{ runner.temp }}/ci_reference.candidate.json" \
            --source "github-actions ubuntu-latest, test (3.11), -n auto"
          echo "Refresh tests/ci_reference.json from the" \
               "ci-reference-candidate artifact on this run."
          # UX-476: and from the log, for a reader who has the log and
          # not the artifact - a terminal, an API client, a proxy that
          # blocks the artifact's blob host. Inside a collapsed group,
          # so UX-441's rule holds: the failure above is still the last
          # thing anyone scrolls to.
          echo "::group::the same document, for a reader without the artifact"
          cat "${{ runner.temp }}/ci_reference.candidate.json"
          echo "::endgroup::"
          # UX-491: and the gate's own line last, outside the group. The
          # document above is ~400 lines and a log-tail reader gets only
          # the end of it, so the shift the gate printed - two steps and
          # one collapsed document earlier - was out of reach of the
          # spread recorded beside it. The line is the gate's own, read
          # from the file that step wrote; recomputing it here would be
          # the two numbers agreeing by construction (§5).
          echo "the drift gate's line, repeated for a log-tail reader:"
          cat "${{ runner.temp }}/tier_gate.txt" \
            || echo "the gate step wrote no summary - it did not run."
        if: always() && matrix.python-version == '3.11'

      - name: Upload it, so refreshing the reference needs no scrolling
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: ci-reference-candidate
          path: ${{ runner.temp }}/ci_reference.candidate.json
          retention-days: 30

      # `UX-524`: the same shape one file over. `--write` reads the
      # coverage database this run left and prints one line; the map
      # itself travels as an artifact, because it is ~60 KB of rows no
      # log reader wants after a failure (`UX-441`).
      - name: This run's touching map, for adopting
        run: |
          python tools/dev_touch_map.py \
            --write "${{ runner.temp }}/touch_map.candidate.json"
        if: always() && matrix.python-version == '3.12'
        continue-on-error: true

      - name: Upload it, so the adopt job can merge it
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: touch-map-candidate
          path: ${{ runner.temp }}/touch_map.candidate.json
          retention-days: 30

      # UX-336: `make test` runs `-n auto` (see the Makefile). CI is not
      # the loop this item was about - the local one is - but a suite
      # that only ever runs parallel in one place is a suite whose
      # parallel-safety is untested where it matters. This re-runs the
      # tiers' own boundary single-process, so an ordering assumption
      # that xdist happens to hide cannot ship.
      #
      # UX-363: its own budget, still a *lower* one than the parallel
      # step's, but only just. The original reason was that four
      # workers on a two-core runner cost more than they save, making
      # this the faster step by six seconds (13.8-21.4s against
      # 20.5-23.8s). Re-measured 2026-08-29 the two are within a second
      # of each other on every interpreter (17.03-27.0 here against
      # 17.34-25.85 there), so the gap between the budgets is now one
      # second rather than six. Round 66 kept that gap and moved both
      # up one - this step was killed at 30s on 3.9 (run 33303144837)
      # while three interpreters passed it, so the extreme was the
      # runner rather than the tier. UX-421 answered that by retiring
      # the budget rather than moving it again; this is now a hang
      # backstop like the one above. It went unguarded until UX-363: the
      # partition guard's regex stopped at the first `timeout` in this
      # file. SMALL_TIER_BACKSTOP_1P_S in tests/tiers.py.
      - name: Test (small tier, single process)
        run: PYTEST_XDIST= timeout 120 make test-small

  # The AI-native SDLC playbook's Test stage: the eval suite runs "on
  # any change to `CLAUDE.md`, skills or hooks, since that configuration
  # steers the agent and deserves the regression testing that code
  # gets." `make test` already runs this file, so the job is not extra
  # coverage - it is coverage that fires on the branch where it matters.
  # A hook edited in a docs-only PR is exactly the change whose author
  # has least reason to run the whole suite, and a hook that has stopped
  # blocking is not visible by reading it: the first draft of
  # keep-the-guards-able-to-fail.sh read correctly and was inert.
  #
  # The model-in-the-loop half of the play - twenty to fifty real tasks
  # replayed through `claude -p` - needs an API key and a budget and is
  # not built. This is the deterministic half, and says so.
  # UX-457: the candidate, in a log rather than only behind a download.
  #
  # `UX-427` built the artifact so a refresh would be a copy rather than
  # a guess, and `UX-441` moved the document out of the test job's log
  # so a red run's failing assertion stayed the last thing in it. Both
  # still hold. Neither covers *reaching* the bytes: the two hosts
  # GitHub serves run output from -
  # `productionresultssa19.blob.core.windows.net` (artifacts) and
  # `results-receiver.actions.githubusercontent.com` (run-log zips) -
  # are denied by the egress policy of the environment these rounds are
  # worked in, while the GitHub API, and so a single job's log, is not.
  # Round 71 hit that going to add four rows and left the reference
  # stale rather than write them from a laptop's clock.
  #
  # So the document is printed again, in a job that does nothing else.
  # `UX-441`'s trade is untouched by that: there is no failure here for
  # it to bury, because nothing here can fail an assertion.
  tier-reference:
    runs-on: ubuntu-latest
    needs: test
    # The run this is most wanted on is the one whose drift step went
    # red, and that run's `test` job failed - same reason the upload
    # above is `always()`.
    if: always()
    steps:
      - name: Fetch what test (3.11) recorded
        id: fetch
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ci-reference-candidate

      # One `cat` and nothing else, so `get_job_logs` on this job
      # returns the document and not a suite. The fallback keeps a run
      # that died before the upload from reddening a job that only
      # reports.
      - name: The candidate, and nothing else
        run: |
          cat ci_reference.candidate.json \
            || echo "no candidate on this run - test (3.11) did not reach the record step"

  # UX-503: the reference gives itself the rows it does not carry yet.
  #
  # A new test file over the medium floor has no entry, so until round
  # 75 the drift step named it and the session spent a second commit
  # fetching the candidate and appending a row - 19 of the 162 commits
  # since round 64 were that errand. The gate now *records* such a file
  # instead of failing on it (`repeated`), and this is the other half:
  # after the merge, the default branch's own run writes the row back,
  # so the file is judged for drift from the next run on rather than
  # never.
  #
  # Only on `push` to the default branch. On a pull request the head is
  # somebody's branch and its numbers are not merged yet; on the default
  # branch the run measured what is actually there.
  #
  # `--adopt` adds names the reference lacks and rewrites no entry it
  # holds, so this can never quietly move a figure a human recorded - a
  # refresh stays a human's decision (UX-447). Every refusal inside it
  # exits 0, and a rejected push is a warning rather than a red: a
  # bookkeeping job failing the default branch buys nothing.
  tier-reference-adopt:
    runs-on: ubuntu-latest
    needs: test
    if: >-
      always() && github.event_name == 'push'
      && github.ref == format('refs/heads/{0}',
                              github.event.repository.default_branch)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch what test (3.11) recorded
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ci-reference-candidate
      - name: Give the reference the rows it does not carry yet
        run: |
          python tools/dev_tier_drift.py --adopt ci_reference.candidate.json
          if git diff --quiet -- tests/ci_reference.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ci_reference.json
          git commit -m "CI: adopt the tier rows this run measured (UX-503)"
          git push origin "HEAD:${{ github.ref }}" || \
            echo "::warning::the branch refused the update; the rows printed above need a hand"

  # `UX-524`: the touching map gives itself the rows this run measured.
  #
  # `UX-503`'s route, one file over, and for the same reason: a map a
  # human has to record by hand is a map that is stale the first time a
  # round adds a module. Only on `push` to the default branch, because
  # on a pull request the head is somebody's branch; `--adopt` adds
  # edges and removes none, so a run that could not reach a module - no
  # browser, no `bst` - narrows nothing. Every refusal exits 0: a
  # bookkeeping job failing the default branch buys nothing.
  touch-map-adopt:
    needs: test
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch what test (3.12) measured
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: touch-map-candidate
      - name: Merge it into tests/touch_map.json
        run: |
          test -f touch_map.candidate.json || {
            echo "no candidate on this run - test (3.12) did not reach it"
            exit 0
          }
          python tools/dev_touch_map.py --adopt touch_map.candidate.json
          if git diff --quiet -- tests/touch_map.json; then
            echo "the map already carries every edge this run measured"
            exit 0
          fi
          git diff --stat -- tests/touch_map.json
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/touch_map.json
          git commit -m "CI: adopt the touching map this run measured (UX-524)"
          git push origin "HEAD:${{ github.ref }}" || \
            echo "::warning::the branch refused the update; re-run to retry"

  agent-config:
    # Watches: .claude/** , CLAUDE.md , REVIEW.md - the three that steer
    # a session. The workflow triggers on every push and pull request, so
    # this job always runs; the list is what it is *for*, and
    # test_it_watches_every_file_that_steers_the_agent holds it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: The configuration that steers the agent
        run: |
          python3 -m pytest tests/unit/test_the_agent_configuration_holds.py -q

  packaging:
    # UX-77: the front door. Every `bga wrap/extract/capture/...` alias
    # dispatches by importing `tools.<module>`, and `pyproject.toml`
    # packaged `bga*` only - so the first command the real-project docs
    # tell a new user to run died with a raw `ModuleNotFoundError` for
    # anyone who installed the package. Nothing caught it because every
    # consumer avoided the alias path: this job runs a built wheel in a
    # clean venv from an empty directory, which is exactly the path a
    # user takes and the one no other job exercises.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build a wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist/

      - name: Install the wheel into a clean venv (not editable, not from the repo)
        run: |
          python -m venv /tmp/pkgvenv
          /tmp/pkgvenv/bin/pip install dist/*.whl

      - name: Every documented command, parsed and really run
        # `cd /tmp/empty` matters: a console-script entry point does not
        # put the working directory on sys.path, which is precisely how
        # running from the repo root hid this for every prior round.
        #
        # UX-325: this step was a hand-written list of nineteen aliases,
        # written in round 12 and `--help`-only. It could not have found
        # `bga snapshot --aggregate` dying with `ModuleNotFoundError` on
        # every install - `--aggregate` is a flag, not an alias, and a
        # `--help` never reaches the import. So the list is now *derived*
        # from the architecture's command table (which UX-322's guard
        # holds equal to the parser), and eighteen of the twenty-one
        # commands are run for real against fixtures the script builds.
        # The three it cannot run carry a written reason.
        run: |
          set -euo pipefail
          mkdir -p /tmp/empty && cd /tmp/empty
          python "$GITHUB_WORKSPACE/tests/installed_command_sweep.py" \
            --bga /tmp/pkgvenv/bin/bga

      - name: The everything extra installs everything
        # UX-200: `bga[all]` is the form the README tells a user to run,
        # so CI runs it. A separate venv from the one above, because
        # this one deliberately pulls buildstream and argcomplete in and
        # the wheel-shape checks want the minimal install.
        run: |
          set -euo pipefail
          python -m venv /tmp/allvenv
          /tmp/allvenv/bin/pip install --quiet "$(ls dist/*.whl)[all]"
          # Import, not `__version__`: argcomplete does not define one,
          # and asserting on it made this step fail on its first local
          # run. Importing is the claim that matters anyway.
          /tmp/allvenv/bin/python -c "
          import argcomplete, buildstream
          print('argcomplete and buildstream both import')
          "
          # `dev` is the contributor set and must stay out of `all` -
          # the runtime emits schemas and never validates against them.
          if /tmp/allvenv/bin/python -c "import jsonschema" 2>/dev/null; then
            echo "jsonschema came in with [all]; it is a dev-only concern" >&2
            exit 1
          fi
          echo "[all] installs the user-facing set and nothing more"

      - name: The installed viewer really serves a page
        # UX-203: the packaging loop above runs `--help` for every alias
        # and never serves anything, so the class that shipped "broken in
        # every installed shape" (an ASSET_DIR derived from the checkout
        # layout, `from tools.` imports) was guarded only by static
        # assertions about configuration. This is the install-shape
        # exercise that found it, kept.
        #
        # Falsified against the real defect: restoring the checkout-relative
        # ASSET_DIR, building a wheel and installing it makes this step's
        # `curl app.js` fail. Measured.
        #
        # UX-203's filing proposed a different mutation - "fails when
        # package-data loses the viewer glob" - and that one does *not*
        # hold: emptying `[tool.setuptools.package-data]`'s `bga` entry,
        # with a cleared `build/` and even with `include-package-data =
        # false`, still ships all seven viewer files, because this
        # setuptools includes files under a package directory regardless.
        # So package-data is not the lever that keeps them in the wheel,
        # and a guard written around it would have asserted nothing.
        run: |
          set -euo pipefail
          rm -rf /tmp/viewrun && mkdir -p /tmp/viewrun
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/golden/mixed_task_kinds" /tmp/viewrun/run
          rm -f /tmp/viewrun/run/expected_output.json
          cd /tmp
          /tmp/pkgvenv/bin/bga view /tmp/viewrun/run --no-browser > /tmp/view.log 2>&1 &
          VIEW_PID=$!
          trap 'kill $VIEW_PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            URL=$(grep -oE 'http://127\.0\.0\.1:[0-9]+/' /tmp/view.log | head -1) || true
            [ -n "${URL:-}" ] && break
            sleep 0.25
          done
          if [ -z "${URL:-}" ]; then
            echo "the installed viewer never printed a url:" >&2
            cat /tmp/view.log >&2
            exit 1
          fi
          echo "serving at $URL"
          # The page, two assets and the payload - an asset is the half
          # that package-data governs, and the payload is the half that
          # the imports govern.
          #
          # `UX-450` is why there are two. This step fetched `app.js`
          # alone and grepped it for `renderSection`, which that item
          # moved to `sections.js` when `app.js` hit `UX-337`'s
          # 1,500-line ceiling - so the step went red for a marker that
          # had moved, in the one file the suite does not scan. The
          # markers below are each grepped in the module that owns
          # them, and a second asset is fetched because the entry
          # module alone no longer proves the viewer arrived whole.
          curl -fsS "${URL}index.html"    > /tmp/index.html
          curl -fsS "${URL}app.js"        > /tmp/app.js
          curl -fsS "${URL}sections.js"   > /tmp/sections.js
          curl -fsS "${URL}report.json"   > /tmp/report.json
          grep -q "bga-report\|id=\"report\"" /tmp/index.html
          grep -q "async function boot" /tmp/app.js
          grep -q "export function renderSection" /tmp/sections.js
          # UX-293: the expected contract is *read from the tree*, not
          # pinned here. This step asserted the contract literally and
          # went red the moment `UX-288` bumped it - a check failing
          # because the thing it checks was deliberately changed, in the
          # one file the suite does not scan. What this step is for is
          # that an installed wheel serves its assets and a real
          # payload; the version literal was never the point.
          EXPECTED=$(python -c "import re,pathlib; \
            print(re.search(r'^ANALYZE = \"([^\"]+)\"', \
              pathlib.Path('$GITHUB_WORKSPACE/bga/schemas.py').read_text(), \
              re.M).group(1))")
          # `UX-344` is why the second assertion is no longer a key
          # literal either. It read `d['signals']`, and that round
          # lifted the namespace away - so this step went red for the
          # same reason `UX-288` reddened the version literal, in the
          # same file the suite does not scan. The keys a full report
          # always carries are published by the *installed* package,
          # which is what this job is testing, so they are read from it.
          /tmp/pkgvenv/bin/python -c "import json,sys; \
            from bga import schemas; \
            d=json.load(open('/tmp/report.json')); \
            key=schemas.VERSION_KEY; \
            assert d[key]==sys.argv[1], (d.get(key), sys.argv[1]); \
            missing=[k for k in schemas.ANALYZE_FULL_KEYS if k not in d]; \
            assert not missing, ('the payload is missing', missing); \
            print('served', sys.argv[1], 'with all', \
                  len(schemas.ANALYZE_FULL_KEYS), \
                  'always-present keys, from the installed wheel')" "$EXPECTED"

      - name: The wheel owns exactly one top-level name
        # UX-94: `UX-77` made the aliases work by packaging `tools*`,
        # which put a top-level `tools` package into site-packages - the
        # most generic importable name in Python, and one that pip will
        # silently overwrite between two distributions that both ship
        # it. The directory stays `tools/` in the repo and installs as
        # `bga._tools`; this asserts the built artifact, not the config.
        run: |
          set -euo pipefail
          top=$(unzip -l dist/*.whl | awk '{print $4}' | grep -v '^$' \
                | cut -d/ -f1 | grep -vE '^(Name|----)$' | sort -u | grep -v dist-info)
          echo "top-level entries in the wheel: $top"
          [ "$top" = "bga" ] || { echo "wheel ships more than bga/: $top" >&2; exit 1; }
          mkdir -p /tmp/empty && cd /tmp/empty
          if /tmp/pkgvenv/bin/python -c "import tools" 2>/dev/null; then
            echo "something is importable as top-level 'tools' - the name is squatted" >&2
            exit 1
          fi
          echo "nothing squats the 'tools' name"

      - name: The packaged capture path carries its own C source
        # tools/native_trace/hook.c is compiled at capture time and is not
        # a Python module, so it needs package-data or Plane 2 installs
        # broken in a way no --help would reveal.
        run: |
          mkdir -p /tmp/empty && cd /tmp/empty && /tmp/pkgvenv/bin/python -c "
          import os, bga._tools.native_trace
          root = os.path.dirname(bga._tools.native_trace.__file__)
          assert os.path.exists(os.path.join(root, 'hook.c')), 'hook.c missing from the wheel'
          print('hook.c present in the installed package')
          "

  installed-capture:
    # UX-150: the shape real users deploy in - a wheel built from a
    # checkout in one directory, installed into the venv of a project in
    # another, run from a third - is the one shape no job captures in.
    # Every capture CI runs is from the repo checkout with the repo's own
    # layout, and the packaging job above stops at `--help`. So the next
    # `_bwrap_shim_source`-style path assumption ships unnoticed and the
    # next field report starts from zero, which is where round 15 started.
    #
    # The cheap whole-chain assertion is UX-146's own: `--diagnose`
    # reports how many times the bwrap shim ran, and a number greater than
    # zero means bst -> buildbox-run -> PATH shim -> rewritten argv all
    # held, from an installed wheel.
    runs-on: ubuntu-latest
    needs: packaging
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap build-essential cmake
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build a wheel and install it into a project venv elsewhere
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist/
          python -m venv /tmp/projvenv
          /tmp/projvenv/bin/pip install "BuildStream==2.7.0" buildstream-plugins
          # The wheel, by path, the way a user installs this repo into
          # their own project's venv - not `-e .`, not from the checkout.
          /tmp/projvenv/bin/pip install dist/*.whl

      - name: Stage a project outside the checkout
        run: |
          examples/stage_cpp_toolchain.sh
          mkdir -p /tmp/theirproject
          cp -r examples/06-macro-micro-optimization /tmp/theirproject/proj
          rm -rf /tmp/theirproject/proj/optimized

      - name: Capture it, from a third directory, with no PYTHONPATH
        # The venv is *activated*, which is what a user does and what the
        # capture needs: `bga` launches `bst` as a subprocess, so `bst`
        # has to be on PATH, not merely installed beside the console
        # script. Running `/tmp/projvenv/bin/bga` by full path instead
        # was this job's first failure - and doctor now names that case
        # specifically rather than saying "bst is not installed".
        #
        # `cd /tmp/theirproject/proj` and no PYTHONPATH still matter: the
        # console script does not put cwd on sys.path, which is how every
        # prior round's checkout-relative assumption stayed hidden.
        run: |
          set -euo pipefail
          export PATH="/tmp/projvenv/bin:$PATH"
          cd /tmp/theirproject/proj
          unset PYTHONPATH
          bga doctor .
          bga snapshot --diagnose -- bst --builders 2 build all.bst

      - name: The whole chain held
        run: |
          set -euo pipefail
          export PATH="/tmp/projvenv/bin:$PATH"
          cd /tmp/theirproject/proj
          snapshot=$(ls -d .bga/runs/*/ | tail -1)
          echo "snapshot: $snapshot"
          test -d "$snapshot/run"          || { echo "no run directory" >&2; exit 1; }
          test -s "$snapshot/plane2.json"  || { echo "no Plane 2 report" >&2; exit 1; }
          test -s "$snapshot/build.log"    || { echo "no Plane 1 log" >&2; exit 1; }
          ran=$(grep -c '"injected"' "$snapshot/plane2.json.diagnostics.jsonl" || true)
          echo "the bwrap shim ran $ran time(s) from an installed wheel"
          [ "$ran" -gt 0 ] || {
            echo "the shim never ran: bst -> buildbox-run -> PATH shim is broken" >&2
            exit 1
          }
          bga analyze @last > /dev/null
          echo "analyze @last resolved from the store, in a foreign venv"

  bst-smoke:
    # Real `bst build` needs a sandbox (bubblewrap) - whether unprivileged
    # user namespaces work on GitHub's ubuntu-latest runners is unverified
    # until this actually runs there (Ubuntu can restrict this via AppArmor
    # by default). This job is a minimal, fast check of exactly that, using
    # the existing tests/fixtures/bst_show_project fixture's manual.bst
    # (kind: manual, real install-commands - the one existing element kind
    # that genuinely exercises the sandbox, not just an import). It exists
    # to de-risk before investing in a fuller real-build CI job/example
    # projects: if this doesn't work, that job needs a different design.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap busybox-static

      - name: Allow bwrap to configure loopback in its network namespace
        # Confirmed via a real run: bwrap's user+mount namespace setup and
        # file staging both succeed unmodified (the actual open risk this
        # job exists to check). The build then failed with "bwrap: loopback:
        # Failed RTM_NEWADDR: Operation not permitted" - a narrower, known
        # issue where Ubuntu 24.04+'s apparmor_restrict_unprivileged_userns
        # sysctl (default 1) withholds CAP_NET_ADMIN inside the sandbox's
        # own network namespace, so it can't bring up its own loopback
        # interface. Same root cause reported for anthropics/claude-code#14719
        # and openai/codex under GitHub Actions; the standard fix is this
        # sysctl override, scoped to this runner only.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install bga with bst extra
        run: pip install -e ".[bst]"

      - name: bst --version
        run: bst --version

      - name: Stage a shell into the sandbox root (fixture has none by default)
        # manual.bst's only dependency (base.bst) is a bare `import` element
        # with no shell binary, so `install-commands` has nothing to exec
        # against. Staging a static busybox as /bin/sh gives the sandbox a
        # real shell without committing a binary to the repo or touching the
        # fixture other bst-gated tests rely on (this only exists in this
        # job's own ephemeral checkout).
        run: |
          mkdir -p tests/fixtures/bst_show_project/files/base/bin
          cp "$(command -v busybox)" tests/fixtures/bst_show_project/files/base/bin/sh

      - name: Real sandboxed build (manual.bst)
        working-directory: tests/fixtures/bst_show_project
        run: bst build manual.bst

  bst-tests:
    # UX-84: the bst-gated tier, actually gated.
    #
    # 18 tests are `skipif`-gated on a real `bst` (five of them also on
    # bwrap, three on a C compiler and two on an installed `bga`). No job ran pytest with bst installed - the
    # `test` matrix has no bst, and `bst-smoke`/`bst-examples` run builds,
    # not pytest - so those 14 were skipped everywhere CI looked, and a
    # skip is indistinguishable from a pass in a summary line. They had
    # in fact drifted: two assertions outlived the mechanisms they
    # described (UX-31 superseding UX-22's max-jobs capture route, UX-17
    # widening `cpu_accounting_available`) with CI permanently green.
    #
    # A single Python version is enough - this job is about the bst seam,
    # not about interpreter compatibility, which the `test` matrix covers.
    runs-on: ubuntu-latest
    needs: [test, bst-smoke]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bubblewrap and a C toolchain
        # bwrap for the sandbox; gcc for the two tests that compile the
        # Plane 2 LD_PRELOAD hook (`bst/bwrap/cc not all found on PATH`);
        # cmake because staging the example toolchain below needs it on
        # the host to copy from.
        run: sudo apt-get update && sudo apt-get install -y bubblewrap busybox-static build-essential cmake

      - name: Allow bwrap to configure loopback in its network namespace
        # Same sysctl as bst-smoke - see that job for the full diagnosis.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install bga with the dev and bst extras, plus buildstream-plugins
        # buildstream-plugins carries the `git` source kind that
        # test_real_project_refs_lifecycle_clean_then_dirtied needs.
        run: |
          pip install -e ".[dev,bst]"
          pip install buildstream-plugins

      - name: bst --version
        run: bst --version

      - name: Stage what the two dual-plane tests build
        # `test_single_real_build_captures_both_planes_and_combined_trace_correlates`
        # and `test_native_build_tracer`'s real-build test both build
        # `examples/05-cmake-cpp-toolchain`'s `core.bst`, and both
        # `pytest.skip` when its sysroot is not staged - a fresh runner
        # has nothing staged. Without this the job would report "12
        # passed, 2 skipped" and the count check below would fail, which
        # is the check working: a skip is what this whole job exists to
        # make impossible. Same two scripts `bst-examples` already runs.
        run: |
          examples/stage_runtimes.sh
          examples/stage_cpp_toolchain.sh

      - name: The environment doctor agrees this job can capture
        # UX-125: wired into CI so its checks cannot drift from reality.
        # This job installs bst, bwrap, a compiler and the staged
        # toolchains - which is exactly the set `doctor` reports on - so
        # a green job with a red doctor means the doctor is wrong.
        run: bga doctor examples/06-macro-micro-optimization

      - name: The bst-gated tier runs, and every one of it passes
        # `-m bst` is the assertion, not a convenience: it selects exactly
        # the marked tier, so "42 passed" is a claim about the tier rather
        # than about the suite. A skip inside it would still show as
        # `passed` in the exit code, hence the explicit count check below.
        #
        # `python -m pytest`, not bare `pytest`, and the difference is
        # load-bearing: only the former puts the working directory on
        # `sys.path`, and six test modules do `from tests.fixtures import
        # topologies` (`tests/` is not a package). Bare `pytest` fails
        # collection on all six before running anything - which is how
        # this job first went red. `make test` has always used
        # `python -m pytest`; this now matches it.
        #
        # `set -o pipefail` is load-bearing, not tidiness (`UX-97`): the
        # step's exit status is the *last* command in the pipe, which is
        # `tee`, and `tee` succeeds whatever pytest did. The count check
        # below catches an ordinary failure (`17 passed, 1 failed` fails
        # the `18 passed` grep) but not `18 passed, 1 error` - a teardown
        # or collection error alongside a full pass, which satisfies the
        # grep and greens the job. Demonstrated:
        #   bash -c 'false | tee /dev/null'; echo $?                 -> 0
        #   bash -c 'set -o pipefail; false | tee /dev/null'; echo $? -> 1
        run: |
          set -o pipefail
          python -m pytest -m bst -rs -p no:cacheprovider | tee /tmp/bst-tier.txt

      - name: No test was skipped for a missing bst
        # The failure this job exists to make impossible: bst silently
        # absent, the tier skipped, CI green. If the tier grows, update
        # the expected count deliberately - that is the point of pinning
        # it rather than asserting "> 0".
        run: |
          set -euo pipefail
          if grep -q "SKIPPED" /tmp/bst-tier.txt; then
            echo "A bst-gated test was SKIPPED - bst is not really installed in this job:" >&2
            grep "SKIPPED" /tmp/bst-tier.txt >&2
            exit 1
          fi
          # Not anchored to column 0: pyproject's `addopts = "-v"` makes
          # the summary line `===== 45 passed, 5543 deselected in ... =====`.
          # Bounded on both sides so "145 passed" cannot satisfy it.
          #
          # The number here and the number in the `echo` below are the
          # same pin written twice, and round 72 shipped them disagreeing
          # - grep 43, echo 45 - for two commits, because
          # `test_the_bst_tier_pin_matches_what_collects` read the echo
          # and nothing read the grep. It now reads both (`UX-480`).
          grep -qE "(^|[[:space:]=])45 passed([[:space:],]|$)" /tmp/bst-tier.txt || {
            echo "Expected exactly 45 bst-gated tests to run. Got:" >&2
            tail -3 /tmp/bst-tier.txt >&2
            exit 1
          }
          echo "45 bst-gated tests ran, none skipped."

      - name: The whole suite, with bst present
        # The tier does not live in isolation: an extraction change can
        # break an unmarked test only when a real bst produced the input.
        run: make test

  bst-examples:
    # Real builds of examples/*, gathering corner-case data (chrome
    # traces, full bga run directories, and reports) for later tool
    # development - not correctness-gating (a failure here doesn't mean
    # bga itself is broken), so it's useful even before every corner
    # case it targets (P1-31, P1-32, P4-12, P4-13, P1-37) is fixed - and
    # useful even when it turns up something unplanned (P1-38, a real
    # ZeroDivisionError crash this job's first real run found). See
    # examples/README.md for what each project covers and why.
    runs-on: ubuntu-latest
    needs: [test, bst-smoke]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap busybox-static build-essential cmake

      - name: Allow bwrap to configure loopback in its network namespace
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install bga with bst extra
        run: pip install -e ".[bst]"

      - name: Install buildstream-plugins (needed for 03's git source and 05's cmake element)
        # The `git` source kind and `cmake` element kind aren't in the base
        # buildstream package as of 2.x (docs/spec/ingestion-pipeline.md #7) -
        # confirmed via a real CI failure ("No source plugin registered for
        # kind 'git'" / "No element plugin registered for kind 'cmake'").
        run: pip install buildstream-plugins

      - name: Stage runtime shells for manual/compose elements
        run: examples/stage_runtimes.sh

      - name: Stage real gcc/cmake/make toolchain for 05-cmake-cpp-toolchain
        # A full real sysroot staged from THIS runner's own installed
        # build-essential/cmake packages - see examples/stage_cpp_toolchain.sh
        # for why (BuildStream's sandbox binds in nothing from the host
        # except staged dependencies) and the real trial-and-error it took.
        run: examples/stage_cpp_toolchain.sh

      - name: Build + extract + analyze 01-resource-contention
        run: |
          set -euo pipefail
          OUT=artifacts/01-resource-contention
          mkdir -p "$OUT"
          START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          (cd examples/01-resource-contention && bst --builders 2 build all.bst) 2>&1 | tee "$OUT/build.log"
          python3 -m tools.bst_log_to_chrome_trace --format raw --start-time "$START" "$OUT/build.log" "$OUT/chrome-trace.json"
          python3 -m tools.bst_extract_run --format raw --start-time "$START" examples/01-resource-contention "$OUT/build.log" "$OUT/run"
          # bga analyze failures are real corner-case data in their own
          # right (this whole job exists to surface exactly this kind of
          # thing against real builds - see P1-38, found this way) - record
          # and continue rather than losing the rest of this job's output.
          if ! bga analyze -f json -o "$OUT/report.json" -d -r "$OUT/run" 2> "$OUT/report.json.stderr"; then
            echo "bga analyze -f json FAILED (see report.json.stderr)" | tee "$OUT/report.json.FAILED"
          fi
          if ! bga analyze -f text -o "$OUT/report.txt" -d -r "$OUT/run" 2> "$OUT/report.txt.stderr"; then
            echo "bga analyze -f text FAILED (see report.txt.stderr)" | tee "$OUT/report.txt.FAILED"
          fi

      - name: Build + extract + analyze 02-deep-chain-mixed-kinds
        run: |
          set -euo pipefail
          OUT=artifacts/02-deep-chain-mixed-kinds
          mkdir -p "$OUT"
          START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          (cd examples/02-deep-chain-mixed-kinds && bst build all.bst) 2>&1 | tee "$OUT/build.log"
          python3 -m tools.bst_log_to_chrome_trace --format raw --start-time "$START" "$OUT/build.log" "$OUT/chrome-trace.json"
          python3 -m tools.bst_extract_run --format raw --start-time "$START" examples/02-deep-chain-mixed-kinds "$OUT/build.log" "$OUT/run"
          # See the 01-resource-contention step's comment: record and
          # continue rather than losing the rest of this job's output.
          if ! bga analyze -f json -o "$OUT/report.json" -d -r "$OUT/run" 2> "$OUT/report.json.stderr"; then
            echo "bga analyze -f json FAILED (see report.json.stderr)" | tee "$OUT/report.json.FAILED"
          fi
          if ! bga analyze -f text -o "$OUT/report.txt" -d -r "$OUT/run" 2> "$OUT/report.txt.stderr"; then
            echo "bga analyze -f text FAILED (see report.txt.stderr)" | tee "$OUT/report.txt.FAILED"
          fi

      - name: Build + extract + analyze 03-project-refs-identity (v1)
        run: |
          set -euo pipefail
          PROJ=examples/03-project-refs-identity
          OUT=artifacts/03-project-refs-identity
          mkdir -p "$OUT"
          examples/stage_project3_remote.sh

          (cd "$PROJ" && bst source track libbar.bst)
          git -c user.name=bga-ci -c user.email=bga-ci@example.invalid \
            add "$PROJ/project.refs"
          git -c user.name=bga-ci -c user.email=bga-ci@example.invalid \
            commit -q -m "ci: track examples/03-project-refs-identity project.refs (v1, local only, never pushed)"

          START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          (cd "$PROJ" && bst build all.bst) 2>&1 | tee "$OUT/build-v1.log"
          python3 -m tools.bst_log_to_chrome_trace --format raw --start-time "$START" "$OUT/build-v1.log" "$OUT/chrome-trace-v1.json"
          python3 -m tools.bst_extract_run --format raw --start-time "$START" "$PROJ" "$OUT/build-v1.log" "$OUT/run-v1"
          if ! bga analyze -f json -o "$OUT/report-v1.json" -d -r "$OUT/run-v1" 2> "$OUT/report-v1.json.stderr"; then
            echo "bga analyze -f json FAILED (see report-v1.json.stderr)" | tee "$OUT/report-v1.json.FAILED"
          fi

          echo "--- --strict against a clean, committed project.refs (expect PASS) ---" | tee -a "$OUT/strict-check.txt"
          python3 -m tools.bst_extract_run --strict --format raw --start-time "$START" "$PROJ" "$OUT/build-v1.log" "$OUT/run-v1-strict" 2>&1 \
            | tee -a "$OUT/strict-check.txt"

      - name: Touch, retrack, and rebuild 03-project-refs-identity (v2)
        # Real retry/rebuild + a real negative --strict case (P1-37):
        # after this, project.refs differs from the local v1 commit made
        # in the previous step but hasn't been re-committed yet.
        run: |
          set -euo pipefail
          PROJ=examples/03-project-refs-identity
          OUT=artifacts/03-project-refs-identity
          examples/stage_project3_remote.sh --update

          (cd "$PROJ" && bst source track libbar.bst)

          echo "--- --strict against a dirty (uncommitted) project.refs (expect FAIL) ---" | tee -a "$OUT/strict-check.txt"
          if python3 -m tools.bst_extract_run --strict --format raw --start-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$PROJ" "$OUT/build-v1.log" "$OUT/run-dirty-strict" 2>&1 \
            | tee -a "$OUT/strict-check.txt"; then
            echo "UNEXPECTED: --strict passed against a dirty project.refs" >&2
            exit 1
          fi

          git -c user.name=bga-ci -c user.email=bga-ci@example.invalid \
            add "$PROJ/project.refs"
          git -c user.name=bga-ci -c user.email=bga-ci@example.invalid \
            commit -q -m "ci: track examples/03-project-refs-identity project.refs (v2, local only, never pushed)"

          START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          (cd "$PROJ" && bst build all.bst) 2>&1 | tee "$OUT/build-v2.log"
          python3 -m tools.bst_log_to_chrome_trace --format raw --start-time "$START" "$OUT/build-v2.log" "$OUT/chrome-trace-v2.json"
          python3 -m tools.bst_extract_run --format raw --start-time "$START" "$PROJ" "$OUT/build-v2.log" "$OUT/run-v2"
          if ! bga analyze -f json -o "$OUT/report-v2.json" -d -r "$OUT/run-v2" 2> "$OUT/report-v2.json.stderr"; then
            echo "bga analyze -f json FAILED (see report-v2.json.stderr)" | tee "$OUT/report-v2.json.FAILED"
          fi

          echo "--- --strict against a clean, re-committed project.refs (expect PASS) ---" | tee -a "$OUT/strict-check.txt"
          python3 -m tools.bst_extract_run --strict --format raw --start-time "$START" "$PROJ" "$OUT/build-v2.log" "$OUT/run-v2-strict" 2>&1 \
            | tee -a "$OUT/strict-check.txt"

      - name: Build + extract + analyze + compare 04-critical-path-optimization
        # Uses tools/bst_run_wrapped.py (live UTC-timestamped capture) and
        # --format wrapped throughout, not --format raw like 01-03 above -
        # --format raw was found, while building this example, to corrupt
        # cross-task ordering on a saved multi-task log (BuildStream's own
        # elapsed prefix is per-activity, not session-wide - see
        # docs/backlog/scenarios/UX-0006-raw-log-timestamp-corruption.md). This step
        # exercises the real optimization-walkthrough scenario
        # (docs/guides/optimization-walkthrough.md, UX-05) end to end: a baseline
        # build, a builders=4 rebuild, an optimized/ project variant, and
        # `bga compare` across all of them.
        run: |
          set -euo pipefail
          PROJ=examples/04-critical-path-optimization
          OUT=artifacts/04-critical-path-optimization
          mkdir -p "$OUT"

          # Each of the three builds below must be a genuine full rebuild -
          # without clearing BuildStream's cache between them, the 2nd/3rd
          # builds are near-total cache hits (nothing to time), producing a
          # ~0s "run" and a nonsensical bga compare verdict (confirmed via
          # a real CI run - see docs/backlog/scenarios/UX-06's sibling finding).
          rm -rf ~/.cache/buildstream ~/.local/share/buildstream
          python3 -m tools.bst_run_wrapped "$PROJ" "$OUT/build-baseline-b2.log" -- bst --builders 2 build all.bst
          python3 -m tools.bst_extract_run --format wrapped "$PROJ" "$OUT/build-baseline-b2.log" "$OUT/run-baseline-b2"
          bga analyze -f text -o "$OUT/report-baseline-b2.txt" -d -r "$OUT/run-baseline-b2"

          rm -rf ~/.cache/buildstream ~/.local/share/buildstream
          python3 -m tools.bst_run_wrapped "$PROJ" "$OUT/build-baseline-b4.log" -- bst --builders 4 build all.bst
          python3 -m tools.bst_extract_run --format wrapped "$PROJ" "$OUT/build-baseline-b4.log" "$OUT/run-baseline-b4"
          bga analyze -f text -o "$OUT/report-baseline-b4.txt" -d -r "$OUT/run-baseline-b4"

          rm -rf ~/.cache/buildstream ~/.local/share/buildstream
          python3 -m tools.bst_run_wrapped "$PROJ/optimized" "$OUT/build-optimized-b4.log" -- bst --builders 4 build all.bst
          python3 -m tools.bst_extract_run --format wrapped "$PROJ/optimized" "$OUT/build-optimized-b4.log" "$OUT/run-optimized-b4"
          bga analyze -f text -o "$OUT/report-optimized-b4.txt" -d -r "$OUT/run-optimized-b4"

          bga compare "$OUT/run-baseline-b2" "$OUT/run-baseline-b4" | tee "$OUT/compare-scheduling.txt"
          bga compare "$OUT/run-baseline-b4" "$OUT/run-optimized-b4" | tee "$OUT/compare-structural.txt"
          bga compare "$OUT/run-baseline-b2" "$OUT/run-optimized-b4" | tee "$OUT/compare-combined.txt"

      - name: Build + extract + analyze + compare 05-cmake-cpp-toolchain
        # Real CMake/C/C++ builds (docs/backlog/scenarios/UX-09) - exercises the
        # same builders/max-jobs joint-optimization question as
        # docs/backlog/scenarios/UX-0009-builders-max-jobs-joint-optimization.md, on
        # whatever real core count this runner happens to have (not
        # gated/asserted - runner CPU counts vary, this just records real
        # numbers for that specific run, same "real corner-case data, not
        # correctness-gating" posture as the rest of this job).
        run: |
          set -euo pipefail
          PROJ=examples/05-cmake-cpp-toolchain
          OUT=artifacts/05-cmake-cpp-toolchain
          mkdir -p "$OUT"

          rm -rf ~/.cache/buildstream ~/.local/share/buildstream
          python3 -m tools.bst_run_wrapped "$PROJ" "$OUT/build-b1j1.log" -- bst --builders 1 --max-jobs 1 build all.bst
          python3 -m tools.bst_extract_run --format wrapped "$PROJ" "$OUT/build-b1j1.log" "$OUT/run-b1j1"
          bga analyze -f text -o "$OUT/report-b1j1.txt" -d -r "$OUT/run-b1j1"

          rm -rf ~/.cache/buildstream ~/.local/share/buildstream
          python3 -m tools.bst_run_wrapped "$PROJ" "$OUT/build-b4j4.log" -- bst --builders 4 --max-jobs 4 build all.bst
          python3 -m tools.bst_extract_run --format wrapped "$PROJ" "$OUT/build-b4j4.log" "$OUT/run-b4j4"
          bga analyze -f text -o "$OUT/report-b4j4.txt" -d -r "$OUT/run-b4j4"

          bga compare "$OUT/run-b1j1" "$OUT/run-b4j4" | tee "$OUT/compare-b1j1-vs-b4j4.txt"

      - name: Build + extract + analyze + compare 06-macro-micro-optimization
        # The macro-then-micro walkthrough project (docs/optimization-
        # walkthrough-06.md, the UX-27..UX-40 backlog round): a baseline
        # that is deliberately mis-optimized in three independent ways
        # and an optimized/ variant that fixes exactly those three. Same
        # "real corner-case data, not correctness-gating" posture as the
        # rest of this job - the point is to keep producing real captures
        # of a build whose *right answer is known*, which is what makes it
        # useful for evaluating any future efficiency metric (UX-27) or
        # CI gate (UX-39) against something other than an opinion.
        #
        # Plane 2 is captured for the baseline too: core.bst's real
        # `make -j1` (UX-31) and its peak-1 compiler concurrency (UX-32)
        # only exist in the native trace, not in BuildStream's own log.
        run: |
          set -euo pipefail
          PROJ=examples/06-macro-micro-optimization
          OUT=artifacts/06-macro-micro-optimization
          mkdir -p "$OUT"

          # Full rebuilds only - see 04's own comment for why clearing the
          # cache between runs is load-bearing here.
          rm -rf ~/.cache/buildstream ~/.local/share/buildstream
          python3 -m tools.bst_run_wrapped "$PROJ" "$OUT/build-baseline.log" -- bst --builders 4 --max-jobs 4 build all.bst
          python3 -m tools.bst_extract_run --format wrapped "$PROJ" "$OUT/build-baseline.log" "$OUT/run-baseline"
          bga analyze -f text -o "$OUT/report-baseline.txt" -d -r "$OUT/run-baseline"
          bga analyze -f json -o "$OUT/report-baseline.json" -d -r "$OUT/run-baseline"

          rm -rf ~/.cache/buildstream ~/.local/share/buildstream
          python3 -m tools.bst_run_wrapped "$PROJ/optimized" "$OUT/build-optimized.log" -- bst --builders 4 --max-jobs 4 build all.bst
          python3 -m tools.bst_extract_run --format wrapped "$PROJ/optimized" "$OUT/build-optimized.log" "$OUT/run-optimized"
          bga analyze -f text -o "$OUT/report-optimized.txt" -d -r "$OUT/run-optimized"
          bga analyze -f json -o "$OUT/report-optimized.json" -d -r "$OUT/run-optimized"

          bga compare "$OUT/run-baseline" "$OUT/run-optimized" | tee "$OUT/compare-baseline-vs-optimized.txt"

          # UX-39: exercise both CI gates for real, in the direction that
          # must FAIL - the optimized build reverted to the mis-optimized
          # one. Recorded rather than gating this job (same "real
          # corner-case data, not correctness-gating" posture as the rest
          # of it), but a wrong exit code here is a real regression in
          # the gate and will be visible in the artifact.
          set +e
          bga compare "$OUT/run-optimized" "$OUT/run-baseline" --fail-on-efficiency-regression \
            > "$OUT/gate-efficiency-regressing.txt" 2>&1
          echo "exit=$? (expected 5)" | tee -a "$OUT/gate-efficiency-regressing.txt"
          bga compare "$OUT/run-baseline" "$OUT/run-optimized" --fail-on-efficiency-regression \
            > "$OUT/gate-efficiency-improving.txt" 2>&1
          echo "exit=$? (expected 0)" | tee -a "$OUT/gate-efficiency-improving.txt"
          set -e

          rm -rf ~/.cache/buildstream ~/.local/share/buildstream
          python3 -m tools.bst_native_build_tracer run \
            --raw-log "$OUT/native-baseline.rawlog" \
            "$PROJ" "$OUT/native-baseline.json" \
            -- bst --builders 4 --max-jobs 4 build all.bst > "$OUT/native-baseline.txt" 2>&1

      - name: Capture 01-resource-contention with the ptrace spine (UX-108)
        # The value case for the spine, on the project that has never had
        # a Plane 2 capture at all: every command `examples/01` runs is
        # static busybox, which `LD_PRELOAD` structurally cannot reach.
        # Both planes from one build (`--wrapped-log`) so the spine's
        # per-element wall spans can be read against Plane 1's task spans
        # - and `sleep 3` is the known answer no other fixture provides:
        # ~0 CPU over ~3s wall, eight times over.
        run: |
          set -euo pipefail
          OUT=artifacts/01-resource-contention
          mkdir -p "$OUT"
          rm -rf ~/.cache/buildstream ~/.local/share/buildstream
          python3 -m tools.bst_native_build_tracer run --trace-spine \
            --raw-log "$OUT/native-spine.rawlog" \
            --wrapped-log "$OUT/native-spine-plane1.log" \
            examples/01-resource-contention "$OUT/native-spine.json" \
            -- bst --builders 2 build all.bst > "$OUT/native-spine.txt" 2>&1

      - name: A generated project is built, and the finding census counts it
        # `UX-473`. Two findings - `build-failed` and `failed-task-time` -
        # cannot come from a committed capture, because every committed
        # capture is of a build that succeeded and `UX-189` says a clone
        # ships no capture at all. The only thing that produces one is
        # `tools/bga_gen_project.py`, and until this step nothing ran it
        # on a schedule: they were reachable by a command somebody had to
        # remember, which is the "true on one machine" shape `UX-213` and
        # `UX-459` are both about.
        #
        # `bga snapshot` exits non-zero here because the build it wraps
        # really does fail - that is the point of the spec - so the exit
        # status is recorded rather than obeyed. The census's own exit
        # status is what this step reports, and it is non-zero only when
        # a finding is neither produced nor declared.
        #
        # `UX-484`: **recorded by capturing it**, not by leaving `-e`
        # off. The body's `set -uo pipefail` sets three options and
        # clears none, and GitHub starts every `run:` block with
        # `shell: /usr/bin/bash -e {0}` - so `-e` was live and the
        # deliberately failing build ended this step on its own exit
        # status for five consecutive runs, before the `echo` below it,
        # let alone the census. `|| status=$?` makes it a handled
        # failure, which `-e` does not act on, so the step is correct
        # under either shell.
        #
        # **Printed, not gated on a bound.** The count over a generated
        # capture has never run twice on the same runner, and a threshold
        # nobody has measured is `UX-458`'s open question one axis over.
        # A drop shows up in this log; turning it into a gate is a row of
        # its own when there is a spread to size it from.
        if: always()
        run: |
          set -uo pipefail
          OUT=artifacts/generated-a-build-that-fails
          mkdir -p "$OUT"
          python3 tools/bga_gen_project.py \
            --spec tests/fixtures/specs/a-build-that-fails.json --out "$OUT/project"
          status=0
          (cd "$OUT/project" && bga snapshot -- bst build all.bst) \
            > "$OUT/snapshot.txt" 2>&1 || status=$?
          echo "bga snapshot exited $status (the build is meant to fail)"
          RUN=$(echo "$OUT"/project/.bga/runs/*/run)
          test -d "$RUN" || { echo "no capture at $RUN" >&2; exit 1; }
          python3 tools/dev_finding_coverage.py --also "$RUN"

      - name: Upload real-build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bst-examples-run-data
          path: artifacts/
          retention-days: 30
