# Real BuildStream project for CI-gathered corner-case data
# (P4-13/P1-37): a git-sourced element under `ref-storage: project.refs`,
# exercising tools/bst_extract_run.py --strict's real consistency check
# and generating real "touch and rebuild" retry data. The git source's
# upstream is a throwaway repo generated deterministically at build time
# by examples/stage_project3_remote.sh into .generated-remote/ (gitignored -
# never committed, same "generate non-source content at build time"
# pattern examples/01 and 02 use for their runtime shells). Its filesystem
# path varies per checkout, so elements/libbar.bst is itself generated
# from elements/libbar.bst.in by that same script (BuildStream project
# options have no free-form string type to hold an arbitrary path -
# confirmed via a real CI failure: only bool/enum/flags/element-mask/
# arch/os are valid) - see examples/README.md for the exact invocation.
name: project-refs-identity-example
min-version: 2.0
element-path: elements
ref-storage: project.refs

# The `git` source plugin is not bundled in the base `buildstream` PyPI
# package as of 2.x - it lives in the separate `buildstream-plugins`
# package (confirmed via a real CI failure: "No source plugin registered
# for kind 'git'" - same fact already documented in
# docs/ingestion-pipeline.md #7/pyproject.toml's `bst` extra comment).
plugins:
- origin: pip
  package-name: buildstream-plugins
  sources:
  - git
