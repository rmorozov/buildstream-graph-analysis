# UX-857: `build: max-jobs: 2` - the server's shape (8 of 40, scaled to
# this box's four cores), read via `$XDG_CONFIG_HOME` rather than
# `--max-jobs` on the `bst` command line (project.conf's own comment
# has the why). `cache:` is UX-755's fix, carried in unchanged (this
# box's real free space is small next to its nominal size; the default
# 5%-of-total reserve alone can exceed it). `bst` 2.x reads
# `buildstream2.conf` first, falling back to `buildstream.conf`; both
# are kept identical here.
cache:
  quota: 3G
  reserved-disk-space: 500M
build:
  max-jobs: 2
