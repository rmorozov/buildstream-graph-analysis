# UX-1132: two independent giants, each on its own critical chain
# (giant-a -> tail-a, giant-b -> tail-b), both ready at once - the shape
# where two long elements share the cores rather than one owning them.
# Same staged sysroot and generator as 11/13 (stage_cpp_toolchain.sh
# hardlink-clones both in); `giant_lines` is 11's knob, carried in.
options:
  giant_lines:
    type: enum
    description: generate.sh's line count per generated C unit, both giants
    values:
    - '1800'
    - '9800'
    default: '9800'
    variable: giant_lines

name: two-giants-example
min-version: 2.0
element-path: elements

plugins:
- origin: pip
  package-name: buildstream-plugins
  elements:
  - cmake
