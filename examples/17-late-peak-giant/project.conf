# UX-1284: one giant whose last step out-peaks every compile before it -
# 32 plain C units of `unit_lines` lines (the wide phase the pool sizes
# itself on), then 4 `-flto` units of `late_k` x `unit_lines` lines
# linked with `-flto-partition=one`, so one lto1 runs after every cc1.
# Measured with the dev host's gcc 13 at 20000 lines: plain cc1 150 MB;
# late_k 2: -flto cc1 82 MB, lto1 451 MB (3.0x); late_k 4: -flto cc1
# 150 MB, lto1 682 MB (4.5x). `check_shape_property.py late-peak` reads
# the ratio off the hook's END lines. Same sysroot and generator as 16.
options:
  unit_lines:
    type: enum
    description: generate.sh's line count per plain C unit, i.e. one compile's cc1 peak RSS
    values:
    - '20000'
    - '40000'
    - '80000'
    default: '40000'
    variable: unit_lines
  late_k:
    type: enum
    description: each -flto unit's lines as a multiple of unit_lines, i.e. how far the link out-peaks a compile
    values:
    - '2'
    - '4'
    default: '4'
    variable: late_k

name: late-peak-giant-example
min-version: 2.0
element-path: elements

plugins:
- origin: pip
  package-name: buildstream-plugins
  elements:
  - cmake
