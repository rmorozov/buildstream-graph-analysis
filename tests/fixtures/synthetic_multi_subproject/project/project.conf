# Synthetic BuildStream project used as the source of truth for the
# multi-subproject fixture in tests/test_synthetic_multi_subproject.py.
#
# This tree is NOT parsed by bga or by the test - bga only ever ingests
# run-context.json/graph.json/trace.json (see docs/specification.md Part
# 32, Data Contracts). It exists purely so the fixture's shape - four
# junctioned subprojects each providing C++ shared libraries, linked into
# one root executable - is documented the way a real BuildStream project
# would express it, and so tests/fixtures/synthetic_multi_subproject/build_model.py
# (the actual, machine-readable source of truth for the graph/schedule)
# can be read side-by-side with something recognizable.
name: synthetic-app
min-version: 2.0
element-path: elements

aliases:
  upstream: https://example.invalid/synthetic/
