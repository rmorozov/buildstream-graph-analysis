<!DOCTYPE html>
<!--
  UX-193. This page is checked into the repository and served as-is:
  no bundler, no npm, no build step. If you are reading it in a browser
  devtools pane, you are reading the same bytes that are in git.

  It renders the *schema*, not the report - see app.js.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bga report</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- UX-317 (styleguide §2b.2): the header carries **identity only** -
     what this run is, within a stated vertical budget. Three lines,
     and `tests/unit/test_apparatus_in_its_place.py` holds them: the
     save-the-trace sentence used to render here, two blocks above the
     control it explains, and it "occupies precious vertical height"
     before the reader has seen a single number. -->
<header>
  <h1 id="run-name">bga</h1>
  <p id="run-path" class="muted"></p>
  <!-- UX-255: which build measured this run (UX-249's producer stamp).
       Hidden until app.js has a payload to fill it from, so a page that
       failed to load never shows a heading that claims something. -->
  <p id="run-producer" class="muted" hidden></p>
</header>
<!-- UX-317 (styleguide §2b.1): **a control's explanation lives with the
     control.** The Perfetto button, the link that works when the pop-up
     does not, and the file to drag into Perfetto yourself are one group
     because they are one decision - how do I get this trace open - and
     nothing here explains a control from under a different heading. -->
<div id="actions-group" class="actions-group">
  <p id="actions" hidden>
    <button id="perfetto">Open timeline in Perfetto</button>
    <!-- `UX-373`: the questions live under the button that opens the
         trace they ask about. This was `sql.html`. -->
    <a href="perfetto.html">Questions to ask it</a>
    <!-- `UX-435`: the two fallbacks are **routes, not paragraphs.**
         They were two `<p>`s of prose under the control, and served -
         the mode `bga view` opens by default - they cost 112px of a
         208px-wide rail against the 45px the controls themselves
         take. Measured on `with_timeline` at 1440x900: the group was
         157px served against 39px exported, and 64.2% of the rail at
         390x844.

         Each is still its own hideable element with its own id, so
         `wireTheHandoff` unhides exactly what it unhid before -
         `perfetto-link.parentElement` is still `#actions-fallback`,
         `trace-download.parentElement` is still `#actions-download`.
         What changed is that they are inline spans on the control's
         own line rather than blocks under it, and that each reads as
         what it does rather than as a sentence about when to do it.
         `UX-198` and `UX-314` added them for measured failures and
         both are still here; this moves them, it does not drop
         either. -->
    <span id="actions-fallback" class="muted" hidden>
      · <a id="perfetto-link" href="#"
           title="Open ui.perfetto.dev on this trace, if the tab-to-tab
                  hand-off did not">ui.perfetto.dev</a>
    </span>
    <span id="actions-download" class="muted" hidden>
      · <a id="trace-download" href="#" download
           title="Save the trace and drag it into ui.perfetto.dev -
                  the route no policy can refuse">save trace</a>
    </span>
    <span id="handoff" class="muted"></span>
  </p>
</div>
<!-- `UX-451`: **the refusal is not written into the rail's column.**

     `#handoff` above is the hand-off's status line, and `app.js` moves
     `#actions-group` into the 240px sticky rail at boot - where the
     group measures 208px. Two of the states it can carry are refusals
     of ~300 characters (Perfetto's connect-src, or a thrown error),
     and 300 characters in a 204px column is twenty lines. Measured on
     `with_timeline`, served, with the refusal forced:

         1440x900   group 408px, 50.7% of the rail (resting: 106px)
          390x844   group 248px, 80.0% of the rail (resting:  62px)

     So the long states are drawn here instead, at the content
     column's width, and the rail keeps the short ones. Same element
     set, same strings - `UX-326` makes the sentence a contract and
     this moves where it is drawn, never its wording. It stays a
     sibling of `#actions-group` rather than a child, because the
     child would travel into the rail with it. -->
<p id="handoff-refusal" class="handoff-refusal" role="status" hidden></p>
<main id="report" aria-busy="true">
  <p class="muted">Loading…</p>
</main>
<footer class="muted">
  <p>Rendered from this run's published JSON — the same document
     <code>bga analyze --format json</code> prints.
     <a href="report.json">report.json</a> ·
     <a href="schemas.json">schemas.json</a></p>
</footer>
<script type="module" src="app.js"></script>
</body>
</html>
