# Small, deliberately-valid BuildStream project used to test
# tools/bst_show_to_graph.py against real `bst show` output (P4-08),
# not just hand-written assumptions about its format.
#
# All sources are `kind: local` (no network access needed to run
# `bst show`/`bst build` against this project - CI/sandbox-safe).
# Deliberately exercises the three things that mattered most when this
# was designed: an element with 2+ build dependencies (tests that
# %{build-deps}'s embedded-newline, multi-item format is parsed
# correctly, not just the empty/single-item case), a runtime-only
# dependency (tests build/runtime type extraction), and a junction
# (tests that `junction-name:element-name` qualified naming survives
# through both `bst show` and a real `bst build`'s log lines
# identically - confirmed empirically, see docs/spec/ingestion-pipeline.md).
name: bst-show-test-project
min-version: 2.0
element-path: elements
