# The junctioned subproject - one real cmake element (Decomposition's
# first input class: UX-871's `%{name} %{kind}` read must resolve it
# under both the junction-qualified and short spellings) plus the
# stack that groups it. Kept minimal - Out of Scope: no second example
# for fifo-style auth (CI's own `make` is 4.3).
name: junctioned-subproj
min-version: 2.0
element-path: elements

plugins:
- origin: pip
  package-name: buildstream-plugins
  elements:
  - cmake
