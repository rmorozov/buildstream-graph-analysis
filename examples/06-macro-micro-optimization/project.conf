# A real BuildStream project built to be walked through a full
# macro-then-micro optimization cycle with `bga` - see
# docs/optimization-walkthrough-06.md.
#
# Unlike examples/05-cmake-cpp-toolchain (which exists to answer one
# question: do `--builders` and native `max-jobs` compete for the same
# cores), this project is deliberately *mis-optimized in three distinct,
# independently-fixable ways*, one per level of the optimization cycle:
#
#   1. MACRO / graph shape: lib-a..lib-f are declared as a six-deep
#      dependency *chain* (lib-b depends on lib-a, lib-c on lib-b, ...)
#      even though none of them uses another's output - they only need
#      core.bst. Six independent libraries are therefore built strictly
#      one after another, on a host with cores to spare.
#
#   2. MACRO / over-declared dependency: every lib-*.bst declares a build
#      dependency on codegen.bst, but only lib-f.bst actually consumes
#      it. codegen.bst is on the critical path of five elements that
#      don't need it.
#
#   3. MICRO / inside one element: core.bst - the heaviest element and
#      the root of the whole graph - carries `notparallel: True`, which
#      is BuildStream's real per-element mechanism for forcing a build
#      task's own native build system down to one job (`${JOBS}` becomes
#      `-j1` for cmake/make/autotools/meson elements; it is also the
#      *only* per-element parallelism control BuildStream 2.7.0 has -
#      `variables: max-jobs:` is a protected variable and is rejected
#      outright). So core.bst compiles its eight ~1s translation units
#      strictly serially while three of the host's four cores sit idle -
#      a problem that is completely invisible in BuildStream's own
#      element-level log, and therefore invisible to `bga`'s Plane 1.
#      It takes Plane 2 (tools/bst_native_build_tracer.py) to see it.
#
# The `optimized/` sibling project fixes all three. Everything else -
# sources, toolchain, element kinds - is identical between the two, so a
# `bga compare` between them isolates exactly these three changes.
name: macro-micro-optimization-example
min-version: 2.0
element-path: elements

plugins:
- origin: pip
  package-name: buildstream-plugins
  elements:
  - cmake
