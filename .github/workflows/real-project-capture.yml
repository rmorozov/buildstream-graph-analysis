# Capture a real, dual-plane `bga` run directory from a real, third-party
# BuildStream project (`freedesktop-sdk`) and publish it as a workflow
# artifact.
#
# Why this workflow exists
# ------------------------
# Every capture `bga` has ever been measured against was produced by a
# build this repository wrote itself. Round 5 pointed the *structural*
# plane at a real project's graph for the first time and immediately found
# `UX-52`, because a real project mixes `runtime` and `build` dependencies
# and no fixture here had ever contained a single runtime edge. That left
# the obvious next question: everything downstream of the graph -
# attribution, floors, occupancy, both efficiency signals and all of
# Plane 2 - has still only ever seen builds written by the same people who
# wrote the analyzer.
#
# Answering it locally is not possible in the development container this
# repository is worked on from: `freedesktop-sdk` bootstraps from a 238MB
# OCI binary seed served by `cdn.registry.gitlab-static.net`, which the
# environment's egress proxy refuses (`403` to `CONNECT`), and its remote
# artifact/source cache at `cache.freedesktop-sdk.io:11001` resets the TLS
# handshake through the same proxy. Both are recorded with their real
# error text in `docs/backlog/scenarios/UX-53-*.md`. A GitHub-hosted runner has
# unrestricted egress, so the capture happens here and the analysis
# happens against the artifact this uploads.
#
# The shape of the capture
# ------------------------
# Building `freedesktop-sdk` from source is a full compiler bootstrap and
# takes many hours; building it with its own artifact cache enabled
# produces a timeline in which nothing was built at all, only pulled.
# Neither is a usable capture. So this does both, in order:
#
#   1. **Warm** - `bst build` the target with the project's own remote
#      cache enabled. Everything is pulled; nothing is timed.
#   2. **Cut** - delete the artifacts of a bounded, upward-closed
#      subgraph (`tools/bst_rebuild_set.py`, which explains why the set
#      has to be upward-closed).
#   3. **Capture** - rebuild with `--ignore-project-artifact-remotes`, so
#      exactly that subgraph builds from source, on top of a cached base,
#      with its real dependencies, real parallelism and real durations.
#
# The default cut set is 25 elements over 9 levels spanning six element
# kinds (autotools, cmake, meson, pyproject, manual, stack) - chosen to be
# deep rather than merely numerous, because depth is what the structural
# plane actually reads.
#
# That is one of the two CI scenarios: the pre-commit run, on a warm
# cache. `capture_mode: cold` (UX-86) is the other - the nightly. It
# skips the warm and cut phases entirely and builds the target's whole
# closure from source with remotes ignored, so `run_mode` comes out
# `full` and every whole-graph structural finding means what it claims.
# The constraint that produced warm-then-cut bounds the *target*, not the
# scenario: a cold capture needs a target whose entire closure fits the
# job budget, and freedesktop-sdk's default target's does not - choosing
# one is an empirical question the first cold dispatch answers.
#
# How to run it
# -------------
# Weekly (`schedule`, UX-81) and on `workflow_dispatch`. It deliberately
# does *not* run on push any more: that trigger cancelled 17 of this
# workflow's first 24 runs through the concurrency group, several after
# 25-57 runner-minutes of a ~65-minute job (UX-90). Capture-tooling
# changes are exercised by CI's `bst-examples` job instead, which traces a
# real sandboxed build of `examples/06` on every push for a fraction of
# the cost.
name: Real-project capture

on:
  workflow_dispatch:
    inputs:
      fdsdk_ref:
        description: freedesktop-sdk commit to capture
        default: 953683fb96b82cdf6d7941c4ba9859378942f22b
      target:
        description: Element whose closure is warmed and then partially rebuilt
        default: components/libxml2.bst
      builders:
        description: bst --builders
        default: "4"
      max_jobs:
        description: bst --max-jobs
        default: "4"
      trace_opens:
        description: Also interpose open()/openat() (UX-46). Slower.
        type: boolean
        default: true
      trace_spine:
        description: >-
          UX-106/UX-108/UX-112. Also run the ptrace process-event spine
          inside the sandbox, which sees statically-linked processes
          LD_PRELOAD structurally cannot. Priced at about a millisecond
          per process, measured as a full spine x opens factorial - with
          this job's 127k processes and trace_opens on by default, budget
          roughly two minutes. There is no spine x opens interaction: the
          spine costs the same alongside opens as without it.
        type: boolean
        default: false
      capture_mode:
        description: >-
          UX-86. `incremental` is the warm-then-cut capture every round so
          far has used: a bounded subgraph rebuilt on top of a cached base,
          which is CI's pre-commit scenario. `cold` skips the warm phase and
          builds the target's whole closure from source with remotes ignored
          - the nightly scenario, which has never been captured. Pick a
          target whose *entire* closure fits the job budget for cold; the
          default target's does not.
        type: choice
        options: [incremental, cold]
        default: incremental
  # UX-81: trend data cannot accumulate if a human has to click. Weekly
  # is enough at ~65 runner-minutes per capture, and three captures of one
  # pinned ref is what `bga compare --baseline-run ... --band-k` needs
  # before it can replace the fixed 1% rule that real noise (2.9%)
  # already beats. Sunday 03:00 UTC: off the weekday peak, and a full
  # week's slack before the next one if a run wedges.
  schedule:
    - cron: "0 3 * * 0"
    # UX-96: the cold mode on its own, lower cadence. Cold history was
    # n=1 and accumulating only when someone remembered to dispatch it,
    # so a cold baseline set - which any cold-vs-cold gate needs first -
    # had no path to existence. Monthly rather than weekly because a
    # cold capture builds a whole closure from source and the question it
    # answers (the project's real critical path) changes on the scale of
    # months, not days. The mode is selected from the schedule below,
    # since a `schedule:` trigger cannot supply workflow inputs.
    - cron: "0 4 1 * *"
  # UX-90: there is deliberately no `push` trigger. Of the first 24 runs
  # of this workflow, **17 were cancelled** - each new push to a working
  # branch killed the in-flight ~65-minute capture through the
  # concurrency group below, several after 25-57 runner-minutes, and on
  # one day five push-triggered runs were cancelled and none published.
  # The path filter could not prevent it either: it is evaluated across
  # the whole pushed commit range, so a docs-only push at HEAD still
  # fired a capture.
  #
  # The need that trigger served - "capture-tooling changes should be
  # exercised" - is real and is already met, cheaply, by CI's own
  # `bst-examples` job, which runs `bst_native_build_tracer run` against
  # a real sandboxed build of `examples/06` on every push and pull
  # request, and by `tests/unit/test_rebuild_set.py` for the cut
  # computation. Neither costs a runner-hour.
  #
  # `UX-81` made `schedule:` + `workflow_dispatch` the data-producing
  # paths, which is what left this one with nothing to do.

concurrency:
  group: real-project-capture-${{ github.ref }}
  # Kept for dispatch: two dispatches of the same ref should not race for
  # the same publish refs. With the push trigger gone, this can no longer
  # cancel a capture that a push happened to overlap.
  cancel-in-progress: true

env:
  FDSDK_REF: ${{ github.event.inputs.fdsdk_ref || '953683fb96b82cdf6d7941c4ba9859378942f22b' }}
  TARGET: ${{ github.event.inputs.target || 'components/libxml2.bst' }}
  BUILDERS: ${{ github.event.inputs.builders || '4' }}
  MAX_JOBS: ${{ github.event.inputs.max_jobs || '4' }}
  TRACE_OPENS: ${{ github.event.inputs.trace_opens || 'true' }}
  # A scheduled capture never sets it, so the trend keeps being
  # produced by the same tooling it always was (UX-108).
  TRACE_SPINE: ${{ github.event.inputs.trace_spine || 'false' }}
  # A dispatch says what it wants; a schedule says which cron fired, and
  # the monthly one is the cold capture (UX-96).
  CAPTURE_MODE: ${{ github.event.inputs.capture_mode || (github.event.schedule == '0 4 1 * *' && 'cold') || 'incremental' }}

jobs:
  capture:
    runs-on: ubuntu-latest
    # The warm phase pulls a multi-GB SDK and the capture phase compiles
    # CPython, OpenSSL, ICU and Doxygen. Generous, but well under the
    # 6h job ceiling; individual steps carry their own tighter limits so
    # one hung phase still leaves the artifacts from the phases before it.
    timeout-minutes: 330
    # Needed by the "Publish" step below, which pushes the capture to a
    # branch. See that step for why the uploaded artifact is not enough.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # BuildStream's CAS plus a freedesktop-sdk base is larger than a
      # stock runner's free space. These four directories are the usual
      # ~25GB of preinstalled toolchains this job never touches.
      - name: Reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install host prerequisites
        run: |
          sudo apt-get update
          # bubblewrap: BuildStream's sandbox, and what the Plane 2 shim
          # shadows on PATH. lzip: needed to unpack some freedesktop-sdk
          # tarball sources.
          sudo apt-get install -y bubblewrap lzip

      # Runs 3 and 4 both died at the first sandboxed element with
      #
      #     bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted
      #
      # and run 4 established it is the runner, not this repository's
      # tooling: the traced build and a plain `bst build` of the same
      # elements failed identically (exit 255 both ways, same message).
      # Ubuntu 24.04 - which `ubuntu-latest` now is - ships
      # `kernel.apparmor_restrict_unprivileged_userns=1`, which leaves
      # bwrap without CAP_NET_ADMIN inside the network namespace it just
      # created, so it cannot bring up `lo`. BuildStream passes
      # `--unshare-net` for every element that does not declare network
      # access, which is nearly all of them.
      #
      # Checked here rather than discovered forty minutes later: a
      # sandbox that cannot start makes every phase after this one
      # pointless.
      - name: Make the sandbox usable, and prove it before spending an hour
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --unshare-net --unshare-pid --ro-bind / / --dev /dev /bin/true
          echo "bwrap --unshare-net works"

      - name: Install BuildStream and bga
        run: |
          pip install -e ".[dev]"
          # Pinned: the version every capture in this repository was taken
          # with, and the one docs/design/architecture.md's claims are checked
          # against. dulwich/requests are freedesktop-sdk's own plugin
          # dependencies (git and docker sources).
          pip install 'BuildStream==2.7.0' 'buildstream-plugins==2.7.0' dulwich requests
          bst --version

      - name: Clone freedesktop-sdk
        run: |
          mkdir -p fdsdk
          git -C fdsdk init -q
          git -C fdsdk remote add origin https://gitlab.com/freedesktop-sdk/freedesktop-sdk.git
          git -C fdsdk fetch -q --depth 1 origin "$FDSDK_REF"
          git -C fdsdk checkout -q FETCH_HEAD
          git -C fdsdk rev-parse HEAD

      # Recorded before anything is built: if a later phase times out, the
      # graph alone still supports the structural half of the audit, which
      # is what round 5 ran on.
      - name: Extract the declared graph
        run: |
          mkdir -p capture
          python3 -m tools.bst_show_to_graph fdsdk "$TARGET" capture/graph-declared.json
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Compute the rebuild set
        run: |
          python3 -m tools.bst_rebuild_set capture/graph-declared.json \
            --cut components/_private/python3-flit-core.bst \
            --cut components/openssl.bst \
            --cut components/expat.bst \
            --cut components/bison.bst \
            --cut components/icu.bst \
            --cut components/doxygen.bst \
            --cut components/which.bst \
            --cut components/ninja.bst \
            --cut "$TARGET" \
            | tee capture/rebuild-set.txt
          wc -l < capture/rebuild-set.txt
        env:
          PYTHONPATH: ${{ github.workspace }}

      # Phase 1: pull the world. Not timed, not captured - this only
      # populates the local CAS so the capture phase has a cached base.
      #
      # `bst build` is the wrong verb here, and the first run of this
      # workflow proved it: it finished in 7 seconds. `bst build` pulls
      # only what it actually needs, and when the target's own artifact is
      # already in the remote there is nothing to build and therefore
      # nothing to pull - the 101 dependencies stayed uncached, which
      # would have left the capture phase (remotes ignored) building the
      # entire compiler bootstrap from source. `artifact pull --deps all`
      # asks for the whole closure explicitly, which is what "warm" means.
      # UX-86: skipped entirely in cold mode - "cold" *means* no cached
      # base. Everything below that reads state-after-warm.txt is
      # likewise conditioned, rather than being handed an empty file and
      # left to draw conclusions from it.
      - name: Warm the local cache from the project's remote cache
        if: env.CAPTURE_MODE != 'cold'
        timeout-minutes: 90
        run: |
          cd fdsdk
          bst --no-interactive artifact pull --deps all "$TARGET"
          bst --no-interactive show --deps all --format '%{name}|%{state}' "$TARGET" \
            > ../capture/state-after-warm.txt
          echo "cached after warm: $(grep -c '|cached$' ../capture/state-after-warm.txt) / $(wc -l < ../capture/state-after-warm.txt)"

      # Phase 2: cut. Sources are fetched *before* the capture so the
      # timed build is dominated by real build work rather than by
      # downloads, which is the timeline the analysis is about.
      - name: Delete the rebuild set and pre-fetch its sources
        if: env.CAPTURE_MODE != 'cold'
        timeout-minutes: 45
        run: |
          cd fdsdk
          xargs -a ../capture/rebuild-set.txt \
            bst --no-interactive artifact delete
          # Only the deleted elements need sources: everything else is
          # still cached and will never be built.
          xargs -a ../capture/rebuild-set.txt \
            bst --no-interactive source fetch --deps none
          bst --no-interactive show --deps all --format '%{name}|%{state}' "$TARGET" \
            > ../capture/state-after-delete.txt

      # The capture is only bounded if the set of elements BuildStream
      # considers un-built is *exactly* the set that was deleted. One
      # dependency that failed to pull would silently turn a 30-minute
      # capture into an attempt to build a compiler from source, and the
      # only symptom would be a job that times out two hours later.
      # UX-86: in cold mode there is no cut to verify - nothing is cached
      # and the whole closure is expected to build, which is the point.
      # The sources still need fetching first, for the same reason as in
      # the incremental path: the timed build should be dominated by real
      # build work rather than by downloads.
      - name: Pre-fetch every source in the closure (cold mode)
        if: env.CAPTURE_MODE == 'cold'
        timeout-minutes: 90
        run: |
          cd fdsdk
          bst --no-interactive source fetch --deps all "$TARGET"
          bst --no-interactive show --deps all --format '%{name}|%{state}' "$TARGET" \
            > ../capture/state-after-delete.txt
          cached=$(grep -c '|cached$' ../capture/state-after-delete.txt || true)
          total=$(wc -l < ../capture/state-after-delete.txt)
          echo "cold start: $cached of $total elements cached (expected 0)"
          if [ "$cached" != "0" ]; then
            echo "a cold capture with cached elements is not a cold capture" >&2
            exit 1
          fi

      - name: Verify the cut is exactly the rebuild set
        if: env.CAPTURE_MODE != 'cold'
        run: |
          python3 - <<'EOF'
          from pathlib import Path

          wanted = set(Path("capture/rebuild-set.txt").read_text().split())
          states = {}
          for line in Path("capture/state-after-delete.txt").read_text().splitlines():
              if "|" in line:
                  name, _, state = line.rpartition("|")
                  states[name] = state

          # `junction` elements are not artifacts and are never cached.
          not_built = {n for n, s in states.items() if s not in ("cached", "junction")}

          unexpected = sorted(not_built - wanted)
          already_cached = sorted(wanted - not_built)
          print(f"{len(states)} elements, {len(not_built)} not cached, "
                f"{len(wanted)} in the rebuild set")
          if already_cached:
              print("still cached despite being deleted: " + ", ".join(already_cached))
          if unexpected:
              print("NOT cached and NOT in the rebuild set:")
              for name in unexpected:
                  print(f"  {name} ({states[name]})")
              raise SystemExit(
                  f"{len(unexpected)} element(s) would be built beyond the "
                  "intended cut - the warm phase did not pull the whole closure"
              )
          EOF

      # Phase 3: the capture. One `bst build` invocation feeds both
      # planes (UX-24): the wrapped log is Plane 1, the LD_PRELOAD trace
      # is Plane 2.
      #
      # If the traced build fails, the build is retried *without* the
      # tracer. That is not a workaround - it is the measurement. Run 3
      # died with `bwrap: loopback: Failed RTM_NEWADDR: Operation not
      # permitted` on all four elements it attempted, and nothing in the
      # log says whether the Plane 2 PATH shim caused it or whether plain
      # `bst build` fails the same way on a GitHub-hosted runner. The
      # retry answers exactly that, and either answer is useful: if it
      # succeeds, the shim is implicated and Plane 1 is still captured;
      # if it fails identically, the sandbox is the environment's.
      - name: Capture the build (both planes)
        timeout-minutes: 250
        run: |
          OPENS=""
          if [ "$TRACE_OPENS" = "true" ]; then OPENS="--trace-opens"; fi
          SPINE=""
          if [ "$TRACE_SPINE" = "true" ]; then SPINE="--trace-spine"; fi
          set +e
          python3 -m tools.bst_native_build_tracer run \
            --wrapped-log capture/build.log \
            --raw-log capture/native-trace.log \
            --invocation-log capture/invocations.jsonl \
            --argv-log capture/bwrap-argv.jsonl \
            $OPENS $SPINE \
            fdsdk capture/native-report.json \
            -- bst --no-interactive --builders "$BUILDERS" --max-jobs "$MAX_JOBS" \
                 build --ignore-project-artifact-remotes \
                       --ignore-project-source-remotes "$TARGET"
          traced_rc=$?
          echo "traced build exit: $traced_rc"
          echo "traced_build_exit=$traced_rc" > capture/capture-outcome.txt
          final_rc=$traced_rc
          if [ "$traced_rc" -ne 0 ]; then
            mv capture/build.log capture/build-traced.log
            # A failed build leaves a *failed* artifact cached, so the
            # retry needs --retry-failed or BuildStream skips straight
            # past the elements that just failed.
            python3 -m tools.bst_run_wrapped fdsdk capture/build.log \
              -- bst --no-interactive --builders "$BUILDERS" --max-jobs "$MAX_JOBS" \
                   build --retry-failed \
                         --ignore-project-artifact-remotes \
                         --ignore-project-source-remotes "$TARGET"
            plain_rc=$?
            echo "plain build exit: $plain_rc"
            echo "plain_build_exit=$plain_rc" >> capture/capture-outcome.txt
            final_rc=$plain_rc
            # UX-66: from here the two planes describe DIFFERENT builds -
            # `run/` will be extracted from this plain build's log, while
            # native-report.json came from the traced one. `bga correlate`
            # joins Plane 2 sandboxes against Plane 1 BUILD spans, so
            # leaving both in place would silently match one build's
            # sandboxes to another build's timeline. Keep the Plane 2
            # report under a name nothing joins on, and say so.
            if [ -f capture/native-report.json ]; then
              mv capture/native-report.json capture/native-report-traced-only.json
            fi
            echo "planes_describe_different_builds=1" >> capture/capture-outcome.txt
          fi
          set -e
          # Only a build that failed *both* ways stops the job; a Plane 1
          # capture on its own is still a usable result.
          exit "$final_rc"
        env:
          PYTHONPATH: ${{ github.workspace }}

      # Best-effort on purpose: even a log from a build that failed
      # part-way parses into a run directory, and that is worth having
      # rather than losing the whole round to one failed element.
      - name: Extract the bga run directory
        if: always()
        continue-on-error: true
        run: |
          python3 -m tools.bst_extract_run fdsdk capture/build.log capture/run \
            --format wrapped --native-max-jobs "$MAX_JOBS"
          ls -la capture/run
        env:
          PYTHONPATH: ${{ github.workspace }}

      # Run the analysis here too. Not because the audit happens on the
      # runner - it does not - but so a run that fails a hard gate says so
      # in the job log instead of only in an artifact nobody downloads.
      - name: Analyze
        if: always()
        continue-on-error: true
        run: |
          # -d is --diagnostics (blast radius, criticality probability);
          # the run directory is positional.
          bga analyze -d capture/run | tee capture/analyze.txt
          bga analyze -d capture/run -f json > capture/analyze.json
          bga correlate capture/run capture/native-report.json \
            > capture/correlate.txt 2>&1 || true

      - name: Collect BuildStream's own element logs (Plane 3)
        # UX-91: BuildStream writes a per-element log for every task it
        # runs and keeps them. They are the only source that can say
        # anything about a build nobody captured, and until now every
        # capture threw them away at job teardown. Published alongside
        # the run directory so `bga cache-logs` has a real, large log
        # tree to be checked against - the fdsdk half of UX-91's
        # acceptance test needs exactly this.
        #
        # `_casd/` is excluded: those are the CAS daemon's own logs, in a
        # different format, and there are hundreds of them per build.
        # Compressed rather than copied: this is text and it is bulky.
        if: always()
        run: |
          set -euo pipefail
          log_root="$HOME/.cache/buildstream/logs"
          if [ -d "$log_root" ]; then
            tar -czf capture/bst-element-logs.tar.gz \
                -C "$log_root" --exclude=_casd . || true
            echo "element logs: $(find "$log_root" -name '*.log' -not -path '*/_casd/*' | wc -l) file(s), $(du -sh capture/bst-element-logs.tar.gz | cut -f1) compressed"
          else
            echo "no BuildStream log directory at $log_root - nothing to collect"
          fi

      - name: Record the environment the capture was taken in
        if: always()
        run: |
          {
            echo "fdsdk_ref=$(git -C fdsdk rev-parse HEAD 2>/dev/null || echo unknown)"
            echo "bga_ref=${{ github.sha }}"
            echo "bst_version=$(bst --version 2>/dev/null || echo unknown)"
            echo "runner_os=$(uname -a)"
            echo "nproc=$(nproc)"
            echo "builders=$BUILDERS"
            echo "max_jobs=$MAX_JOBS"
            echo "trace_opens=$TRACE_OPENS"
            # UX-108: a spine capture is a different measurement of the
            # same build - more processes, more wall clock - so it must
            # be visible to `bga baseline`'s homogeneity check rather
            # than silently joining a band of hook-only captures.
            echo "trace_spine=$TRACE_SPINE"
            # UX-86: which of the two CI scenarios this capture is. The
            # run directory carries `run_mode` derived from BuildStream's
            # own Pipeline Summary (UX-55); this records what was *asked
            # for*, so a cold capture that silently found a warm cache is
            # visible as a disagreement rather than as a fact.
            echo "capture_mode=$CAPTURE_MODE"
            # UX-96: the target belongs here for the same reason the mode
            # does. Two captures of *different* targets are different
            # builds, and the ref name carries commit, mode, builders and
            # max_jobs but not this - so before it was recorded, nothing
            # in a baseline set could tell them apart.
            echo "target=$TARGET"
            echo "mem_total_kb=$(awk '/MemTotal/{print $2}' /proc/meminfo)"
          } > capture/capture-context.txt
          df -h / >> capture/capture-context.txt
          cat capture/capture-context.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fdsdk-capture
          path: capture/
          # The native trace of a real build is large and compresses well;
          # the run directory is what the audit actually reads.
          retention-days: 14

      # The uploaded artifact is for humans. It is not reachable from the
      # development container this repository is worked on from: workflow
      # artifacts are served from `*.blob.core.windows.net`, which the same
      # egress policy that blocks the freedesktop-sdk CDN also refuses
      # (`403` to `CONNECT`). So the capture is *also* published to a
      # branch, which is reachable, and which has the side benefit of
      # making each capture a versioned, fetchable object rather than
      # something that expires in 14 days.
      # UX-66: NOT `if: always()`. A cancelled run's publish overwrote a
      # good capture with a 36 KB partial (0-byte native-trace.log, no
      # native-report.json) and the next round's audit nearly analysed
      # it. `always()` is right for the *extraction* steps above - a
      # build that failed part-way still yields a usable Plane 1 log -
      # and wrong here, because this is what everything downstream reads.
      # `!cancelled()` still publishes a genuinely failed build's
      # capture, which is a real result worth having.
      - name: Publish the capture to a branch
        if: ${{ !cancelled() }}
        run: |
          # A capture with no analysis in it is worse than no capture at
          # all: it replaces a good one and looks current.
          if [ ! -f capture/analyze.json ]; then
            echo "no analyze.json - refusing to publish over the previous capture"
            exit 0
          fi
          mkdir -p publish
          # The raw LD_PRELOAD trace of a real build is the only file here
          # that can reach tens of MB. Keep it when it fits comfortably
          # inside GitHub's file-size warning, drop it with a note when it
          # does not - the parsed report is what the analysis reads.
          if [ -f capture/native-trace.log ]; then
            trace_bytes=$(stat -c %s capture/native-trace.log)
            echo "native-trace.log: $trace_bytes bytes"
            if [ "$trace_bytes" -gt 40000000 ]; then
              # UX-57/UX-58: keep a bounded head instead of dropping the
              # whole thing. Enough to check the record format by eye -
              # and deliberately NOT enough for anything time-based:
              # round 7 measured this head covering 17 seconds of a
              # 3584-second build, so sandbox durations derived from it
              # are truncated. The figures that need the whole trace are
              # computed in-job and land in native-report.json, which is
              # published in full.
              head -c 4000000 capture/native-trace.log \
                > capture/native-trace.head.log || true
              echo "full log dropped from the tarball: $trace_bytes bytes;" \
                   "first 4 MB kept as native-trace.head.log" \
                > capture/native-trace.log.omitted
              rm capture/native-trace.log
            fi
          fi
          tar -czf publish/capture.tar.gz -C capture .
          # UX-81: the extracted run directory, uncompressed, beside the
          # tarball. ~155 KB, and it makes `bga analyze <checkout>/run`
          # work on a bare checkout of a capture ref with no untar step -
          # which is what turns a published capture into something a
          # baseline set can be assembled from.
          cp -r capture/run publish/run
          cp capture/capture-context.txt publish/ 2>/dev/null || true
          cp capture/capture-outcome.txt publish/ 2>/dev/null || true
          ls -la publish
          cd publish
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "capture: freedesktop-sdk run ${{ github.run_id }}"

          REMOTE="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

          # UX-81: the per-run ref is the *data*, and it is never
          # force-pushed - each publish used to destroy its predecessor,
          # while the tool's own documented CI usage needs a baseline set
          # of at least three runs of the same shape. The tuple that has
          # to match for those runs to be comparable is in the ref name,
          # so the set is discoverable with one `git ls-remote` and no
          # index file to keep consistent:
          #
          #   git ls-remote origin 'refs/heads/captures/fdsdk/<ref>-<mode>-b4j4-*'
          # UX-86: the mode is part of the shape. A cold capture and an
          # incremental one measure different builds of the same commit -
          # `bga compare` refuses to compare them (UX-78) - so they must
          # not land in the same baseline set through a shared ref glob.
          SHORT_REF="$(echo "$FDSDK_REF" | cut -c1-8)"
          RUN_REF="captures/fdsdk/${SHORT_REF}-${CAPTURE_MODE}-b${BUILDERS}j${MAX_JOBS}-${{ github.run_id }}"
          git push -q "$REMOTE" "HEAD:refs/heads/${RUN_REF}"
          echo "Published to branch ${RUN_REF}"

          # `captures/fdsdk-latest` stays a moving pointer at the newest
          # *good* capture, so every document that references it keeps
          # working. Force is correct here and only here: the data lives
          # at the per-run ref above and is not being overwritten.
          #
          # UX-81: a genuinely failed build is still worth publishing as
          # data - that was `UX-66`'s decision and it stands - but it must
          # not become what `-latest` points at, because everything
          # downstream reads that as the current state of the project.
          # UX-86: each mode has its own pointer. `captures/fdsdk-latest`
          # keeps meaning what every existing document says it means - the
          # newest good *incremental* capture - and a cold one does not
          # silently replace it.
          if [ "$CAPTURE_MODE" = "cold" ]; then
            LATEST_REF="captures/fdsdk-cold-latest"
          else
            LATEST_REF="captures/fdsdk-latest"
          fi
          # UX-114: what `-latest` is allowed to point at, in one place.
          # Kept as a function so the decision can be exercised directly
          # rather than described in prose - `tests/unit/test_latest_ref_publish.py`
          # extracts this definition from this file and runs it.
          #
          # A capture taken with non-default instrumentation is a
          # different *measurement* of the same build (UX-108: the spine
          # records more processes and costs more wall clock). Cold got
          # its own pointer precisely so two kinds of build never mix
          # through a shared ref; a spine capture landing on
          # `fdsdk-latest` reopens that hole one axis over, and it
          # happened: run 32223468993 (`trace_spine=true`) is what
          # `captures/fdsdk-latest` pointed at when UX-114 was filed.
          # Such a capture still publishes its per-run ref - it is data -
          # it just does not become the project's current state.
          publish_decision() {
            if [ "${1:-0}" != "0" ]; then
              echo "failed-build"
            elif [ "$TRACE_SPINE" != "false" ] || [ "$TRACE_OPENS" != "true" ]; then
              echo "non-default-instrumentation"
            else
              echo "move-latest"
            fi
          }

          traced_rc="$(sed -n 's/^traced_build_exit=//p' capture-outcome.txt 2>/dev/null || true)"
          case "$(publish_decision "${traced_rc:-0}")" in
            move-latest)
              git push -q --force "$REMOTE" "HEAD:refs/heads/${LATEST_REF}"
              echo "Moved ${LATEST_REF} to this capture"
              ;;
            non-default-instrumentation)
              echo "trace_spine=${TRACE_SPINE} trace_opens=${TRACE_OPENS} is not the" \
                   "scheduled default instrumentation: published as data at ${RUN_REF}," \
                   "leaving ${LATEST_REF} pointing at the last default-instrumentation capture"
              ;;
            failed-build)
              echo "traced build exited ${traced_rc}: published as data at ${RUN_REF}," \
                   "leaving ${LATEST_REF} pointing at the last good capture"
              ;;
          esac

      - name: Cache health trend across the retained refs
        # UX-103 item 3: the trend accumulates without a human. Runs
        # after the publish, so this capture is the newest row and is the
        # run being judged.
        #
        # `continue-on-error` deliberately: a degrading cache is a
        # finding to read, not a reason to fail the job that produced the
        # data. `UX-92` stage 3's deferral of a hard gate stands until
        # there is enough history to set one from evidence.
        continue-on-error: true
        if: always()
        run: |
          set -o pipefail
          SHORT_REF="$(echo "$FDSDK_REF" | cut -c1-8)"
          GLOB="captures/fdsdk/${SHORT_REF}-${CAPTURE_MODE}-b${BUILDERS}j${MAX_JOBS}-*"
          if ! bga baseline --glob "$GLOB" -n 8 --workdir "$RUNNER_TEMP/trend" -f json \
               > "$RUNNER_TEMP/trend-set.json"; then
            echo "No comparable baseline set to trend against yet"
            exit 0
          fi
          # `bga baseline` returns newest first; a trend reads forwards,
          # because nothing in a run directory records which build came
          # before it - the order is the caller's to supply.
          DIRS="$(python3 -c 'import json,sys; print(" ".join(m["run_dir"] for m in reversed(json.load(open(sys.argv[1]))["members"])))' "$RUNNER_TEMP/trend-set.json")"
          # shellcheck disable=SC2086
          bga cache-trend $DIRS | tee "$RUNNER_TEMP/trend.txt"
