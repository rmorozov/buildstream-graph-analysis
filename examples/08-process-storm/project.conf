# A fixture with one job: be the worst case for per-process tracing cost.
#
# `UX-106`'s overhead budget is "<2% wall on `examples/06`'s baseline
# and on a configure-heavy fixture (thousands of short-lived processes)",
# with the instruction to build that fixture if no project exhibits it.
# None did: `examples/06` runs 822 processes across ~45s of compiling
# (~18/s), and its cost is dominated by `cc1plus`, not by process
# creation. A real `configure` run inverts that ratio - hundreds of
# two-millisecond `sh`/`cat`/`grep` probes - and this project reproduces
# the ratio without reproducing the autotools.
#
# The processes are deliberately *dynamically* linked (the same staged
# gcc sysroot every other example uses), because a fixture whose
# processes the LD_PRELOAD hook cannot see would measure the spine
# against nothing.
name: process-storm-example
min-version: 2.0
element-path: elements
