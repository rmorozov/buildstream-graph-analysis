# Real BuildStream project for CI-gathered corner-case data (P1-31/P1-32):
# eight independent elements, each doing several real seconds of work, all
# ready to build simultaneously - a genuine fan-out that, when built with a
# builder count smaller than the fan-out width, forces real RESOURCE_WAIT
# and SCHEDULER_WAIT gaps rather than the synthetic ones existing unit
# tests construct by hand. See examples/README.md.
#
# All sources are `kind: local` (no network access needed). The one
# exception - files/runtime/bin's shell binaries - is populated at build
# time by examples/stage_runtimes.sh, not committed (see that script and
# tests/fixtures/bst_show_project's CI precedent for why: no binary blobs
# committed to the repo).
name: resource-contention-example
min-version: 2.0
element-path: elements
