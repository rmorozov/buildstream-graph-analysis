# UX-120: the fine-grained fixture `UX-100`'s acceptance named and never
# got built. Eight siblings with the identical build-dependency set, each
# doing sub-second work inside a sandbox that stages a shared sysroot -
# the "too fine" shape the merge candidate exists to detect.
#
# `bulk.bst` is what makes the shape measurable rather than theoretical.
# BuildStream stages dependencies by hardlink and times its own phases to
# the second, so a normal 8k-file sysroot stages in under a second and
# the toll rounds to **zero** - which is exactly why `UX-100`'s criterion
# had never fired on a real capture. 60k one-byte files is the file count
# at which "Staging dependencies" reaches 1s and the toll becomes
# visible at BuildStream's own resolution. Generate it with
# `examples/09-fine-grained-siblings/generate_bulk.py`.
#
# `merged/` is the same eight units in one element - the fix the
# candidate recommends, so its projection can be checked against a real
# rebuild instead of against arithmetic.
name: fine-grained-siblings-example
min-version: 2.0
element-path: elements

plugins:
- origin: pip
  package-name: buildstream-plugins
  elements:
  - cmake
