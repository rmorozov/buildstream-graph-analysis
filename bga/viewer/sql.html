<!--

  It was "Questions worth asking in Perfetto" and `perfetto.html` was
  "how to open the trace" - the same errand split in half, and a reader
  who presses the button needs both in that order. The export never had
  the split: `app.js` inlines the one section into the report.

  A redirect rather than a deletion, because the URL is published. The
  store's older exports and any bookmark or issue comment that named it
  reach a page that exists and says where the content went - which is
  `UX-281`'s rule (a satellite page is not a dead end) applied to a page
  that has stopped being a satellite.

  `<meta http-equiv="refresh">`, not script: the server sends
  `default-src 'self'` and inline script is refused, which is exactly
  how this page rendered nothing before `UX-266`. The link below is
  what a reader sees if refresh is disabled, so the page is never a
  blank one either way.
-->
