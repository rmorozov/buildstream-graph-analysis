# UX-848: the jobserver's compile-bound evaluation. Round 112 declined
# the mode on examples/06 (a six-deep chain: the wall never moved,
# 30.25s -> 30.46s) because nothing in the tree was compile-bound. This
# project is: four independent elements (two autotools, two cmake),
# each linking one binary from 64 generated C files, so `--jobserver
# auto` has real idle cores to redistribute mid-build instead of a
# declared chain to wait on.
#
# Same staged sysroot as examples/06 (stage_cpp_toolchain.sh hardlink-
# clones it here too - no second toolchain staged).
name: jobserver-example
min-version: 2.0
element-path: elements

plugins:
- origin: pip
  package-name: buildstream-plugins
  elements:
  - cmake
  - autotools
