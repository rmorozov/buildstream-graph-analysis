# UX-1010: the second win shape (Ruslan, 2026-09-24) - one giant
# element plus many single-core elements, so 2x BuildStream `--builders`
# can pack the narrow ones into the cores the giant does not use.
# `examples/11-serial-giant` cannot show this: its three leaves build
# *after* the giant (a dependency), so they never compete with it for a
# builder slot. Here all 24 narrow elements are ready alongside the
# giant from the start.
#
# Same staged sysroot as 05-11 - `../stage_cpp_toolchain.sh`
# hardlink-clones it here too, and hardlink-clones `10-jobserver`'s own
# `files/gen/cmake/generate.sh` in as well (reused, not a second copy).
#
# `giant_lines` is 11's own override, carried in unchanged so a caller
# can shrink the giant without moving its committed default (UX-1009).
options:
  giant_lines:
    type: enum
    description: generate.sh's line count per generated C unit, giant.bst only
    values:
    - '1800'
    - '9800'
    default: '9800'
    variable: giant_lines

name: mixed-graph-example
min-version: 2.0
element-path: elements

plugins:
- origin: pip
  package-name: buildstream-plugins
  elements:
  - cmake
