# Can CodSpeed's bare-metal Graviton runner host UX-895/UX-905's
# off/auto pairs? Answers the three unknowns (sudo and user namespaces
# for bwrap, BuildStream on the architecture, the core count a compile
# scales to), then stages this arch's toolchain and buildbox pins
# (UX-1009) and runs the jobserver showcase for real: `bst build
# all.bst` on `examples/11-serial-giant`, then `calibrate_width.py`.
# The Ryzen leg never started on the free plan - dropped rather than
# left red.
name: CodSpeed runner probe

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-bim9mu]
    paths: [.github/workflows/codspeed-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: codspeed-macro-arm64-graviton-ubuntu-22-04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Host
        run: |
          uname -a
          lscpu
          nproc
          free -g
          df -h / "$RUNNER_TEMP"
          echo "::notice title=host::$(nproc) cpus, $(lscpu | awk -F: '/Thread\(s\) per core/{gsub(/ /,"",$2);print "threads/core "$2}'), $(lscpu | awk -F: '/Model name/{gsub(/^ +/,"",$2);print $2; exit}'), mem $(free -g | awk '/Mem:/{print $2}')G"

      - name: Sandbox prerequisites
        run: |
          if sudo -n true 2>/dev/null; then echo "::notice title=sudo::yes"; else echo "::warning title=sudo::no"; fi
          sysctl kernel.unprivileged_userns_clone kernel.apparmor_restrict_unprivileged_userns user.max_user_namespaces 2>&1 || true
          sudo -n apt-get update -q && sudo -n apt-get install -yq bubblewrap lzip gcc make python3-venv
          # Ubuntu 24.04 restricts unprivileged userns (real-project-capture.yml's same step).
          sudo -n sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          if bwrap --unshare-net --unshare-pid --ro-bind / / --dev /dev /bin/true; then
            echo "::notice title=bwrap::--unshare-net works"
          else
            echo "::error title=bwrap::--unshare-net fails"
          fi

      - name: BuildStream
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/venv"
          . "$RUNNER_TEMP/venv/bin/activate"
          pip install -q --upgrade pip
          pip install -q 'BuildStream==2.8.1' 'buildstream-plugins==2.8.0'
          pip install -q -e .
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          echo "::notice title=bst::$(bst --version 2>&1 | tail -1)"
          bga --help > /dev/null && echo "::notice title=bga::imports"

      # UX-1009: bst 2.8.1's aarch64 install has no buildbox-casd/
      # buildbox-run - the wheel bundling both is x86_64-only, and the
      # sdist aarch64 pip falls back to carries neither. Both are a bare
      # PATH lookup (_get_host_tool_internal, read from the sdist), so
      # staging the pinned closure's bin/ onto PATH is the whole fix.
      # At `/` itself: ELF interpreter and makeCWrapper paths are absolute
      # `/nix/store`, so under a prefix exec reports ENOENT on a file that exists.
      - name: Stage buildbox
        run: |
          sudo -n mkdir -p /nix && sudo -n chown "$(id -u):$(id -g)" /nix
          BIN="$(python3 -m tools.nix_buildbox /)"
          rc=0; "$BIN/buildbox-run" --help > /dev/null 2>&1 || rc=$?
          [ "$rc" -lt 126 ] || { echo "::error title=buildbox::exec failed ($rc)"; exit 1; }
          echo "$BIN" >> "$GITHUB_PATH"
          echo "::notice title=buildbox::$BIN runs"

      # UX-1009: the same pinned toolchain 05-10 use, now with an
      # aarch64 row - staged once, hardlink-cloned into every example
      # including 11-serial-giant.
      - name: Stage toolchain
        run: |
          command -v buildbox-casd
          examples/stage_cpp_toolchain.sh

      # giant.bst's shape at 1800 lines a unit (9800 took 2013s at -j1 on
      # the Graviton), compiled
      # outside any sandbox: the knee is the host's width, not bst's.
      - name: Compile width
        run: |
          W="$RUNNER_TEMP/width"; mkdir -p "$W" && cd "$W"
          sh "$GITHUB_WORKSPACE/examples/10-jobserver/files/gen/autotools/generate.sh" giant 256 1800
          line=""
          for j in 1 2 4 8 16 32; do
            make -s clean
            s=$(date +%s.%N); make -s -j"$j" giant > /dev/null; e=$(date +%s.%N)
            t=$(python3 -c "print(f'{$e-$s:.1f}')")
            echo "width $j ${t}s"
            line="$line $j:${t}s"
          done
          echo "::notice title=width::$line"

      # UX-1009: the jobserver showcase for real, on real cores -
      # examples/README.md's own `11-serial-giant` invocation.
      - name: Build examples/11-serial-giant
        working-directory: examples/11-serial-giant
        env:
          XDG_CONFIG_HOME: ${{ github.workspace }}/examples/11-serial-giant/xdg_config_home
        run: bst build all.bst

      # `CALIBRATE_GIANT_LINES` keeps this inside the job's 90 minutes -
      # `giant.bst`'s committed 9800 lines/unit is unmoved (the build
      # above used it); only this script's own builds shrink.
      - name: Calibrate the runner's width
        env:
          CALIBRATE_GIANT_LINES: "1800"
        run: |
          OUT="$(python3 examples/11-serial-giant/calibrate_width.py examples/11-serial-giant 1 2 4 8 16)"
          echo "$OUT"
          echo "::notice title=calibrate::$(echo "$OUT" | tr '\n' ' ')"
