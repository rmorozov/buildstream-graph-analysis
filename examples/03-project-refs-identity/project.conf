# Real BuildStream project for CI-gathered corner-case data
# (P4-13/P1-37): a git-sourced element under `ref-storage: project.refs`,
# exercising tools/bst_extract_run.py --strict's real consistency check
# and generating real "touch and rebuild" retry data. The git source's
# upstream is a throwaway repo generated deterministically at build time
# by examples/stage_project3_remote.sh into .generated-remote/ (gitignored -
# never committed, same "generate non-source content at build time"
# pattern examples/01 and 02 use for their runtime shells). Its filesystem
# path varies per checkout, so it's passed in via the `remote_path` build
# option rather than hardcoded - see examples/README.md for the exact
# invocation.
name: project-refs-identity-example
min-version: 2.0
element-path: elements
ref-storage: project.refs

options:
  remote_path:
    type: str
    description: Absolute path to the generated throwaway git remote (see examples/stage_project3_remote.sh)
    default: ""
