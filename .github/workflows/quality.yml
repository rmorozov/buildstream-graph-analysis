name: Quality

# UX-698/UX-699: the gate-only shelf. Hosted, minutes, on a pull request
# and weekly - never in `make lint`, so the inner loop stays at ruff's.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint the viewer
        run: |
          npx --yes --package eslint@9 --package globals@17 -- \
            eslint bga/viewer

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The lockfile is the dev extra, resolved
        run: |
          pip install uv
          # UX-1128: seeded, so an upstream release is Dependabot's row, not a red audit.
          cp requirements.lock /tmp/requirements.lock
          uv pip compile pyproject.toml --extra dev -o /tmp/requirements.lock -q
          diff <(grep -v '^#' requirements.lock) <(grep -v '^#' /tmp/requirements.lock) \
            || { echo "requirements.lock is stale: run make lock"; exit 1; }
      - name: Audit the lockfile
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock --strict

  sizes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The size ledger only shrinks
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps
          python3 tools/dev_sizes.py --check
