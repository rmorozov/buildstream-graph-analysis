[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bga"
version = "0.1.0"
description = "BuildStream Build Efficiency Analyzer - Analyze build traces for efficiency metrics"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "BuildStream Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "networkx>=2.8",
    # UX-77: a real runtime dependency of the documented workflow, not a
    # dev convenience - `bga extract` and `bga capture --trace-opens`
    # both read BuildStream YAML. It was in the `dev` and `bst` extras
    # only, so a plain install produced a `bga capture` that could not
    # start.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
    # tools/bst_extract_run.py --strict mode's project.conf reader
    # (P4-13). Listed here too (not just under `bst` below) because most
    # of its own unit tests (tests/unit/test_bst_extract_run_strict.py)
    # are hermetic - real `git`, no real `bst` needed - and must run
    # under plain `pip install -e ".[dev]"` (what CI installs, since the
    # `bst` extra needs the bubblewrap system package CI doesn't have) -
    # a real CI failure (ModuleNotFoundError: yaml) caught this being
    # missing from here originally.
    "pyyaml>=6.0",
    # UX-98: markdown correctness (`make lint-docs`). Chosen because it
    # is pip-installable and so joins the Python-only CI matrix without
    # a Node toolchain. It does NOT cover table cell counts - the one
    # markdown defect this repo has actually shipped - which is checked
    # in tests/unit/test_docs_links_and_commands.py instead; see UX-98
    # for the measurement behind that split.
    "pymarkdownlnt>=0.9",
    # UX-190: validates the published output JSON against the schema
    # `bga <cmd> --schema` prints. A *dev* dependency only - the runtime
    # emits the `schema` key and never validates, so a user's install
    # does not carry a validator to run a check nobody asked for.
    "jsonschema>=4.0",
    # UX-191: shell completion, exercised by its own guards. A *runtime*
    # optional extra as well (`bga[completion]`) - the CLI works without
    # it and the import is guarded.
    "argcomplete>=3.0",
]
# UX-191: `pip install bga[completion]`, then
# `eval "$(register-python-argcomplete bga)"`. Shell completion for the
# argparse program as it stands - a `click` migration was considered and
# declined (see the task file): it would touch every subcommand and
# re-litigate UX-158's help formatting for nothing argcomplete does not
# already give.
completion = ["argcomplete>=3.0"]
# UX-200: the everything form, so a user who wants the full experience
# does not assemble it by hand. Deliberately the *user-facing* set:
# `dev` is the contributor set and stays out of it - jsonschema is a
# dev-only concern, because the runtime emits schemas and never
# validates against them.
all = ["buildstream>=2.0", "pyyaml>=6.0", "argcomplete>=3.0"]

# Real BuildStream, for tools/bst_show_to_graph.py's end-to-end tests
# (tests/unit/test_bst_show_to_graph.py) - skipped automatically when
# `bst` isn't on PATH, so this extra is optional, not part of `dev`.
# Also needs the bubblewrap system package (`apt install bubblewrap` /
# equivalent) and, for real (non-`kind: local`) projects,
# buildstream-plugins - see docs/spec/ingestion-pipeline.md.
bst = [
    "buildstream>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
bga = "bga.cli:main"

[project.urls]
Homepage = "https://github.com/rmorozov/buildstream-graph-analysis"
Documentation = "https://github.com/rmorozov/buildstream-graph-analysis/blob/main/docs/guides/cli.md"
Repository = "https://github.com/rmorozov/buildstream-graph-analysis"
Specification = "https://github.com/rmorozov/buildstream-graph-analysis/blob/main/docs/spec/specification.md"

[tool.setuptools]
# UX-94: the wheel owns exactly one top-level name.
#
# `UX-77` made the alias dispatch work from an installed wheel by
# packaging `tools*` - which shipped a top-level package called `tools`
# into site-packages. That is about the most generic importable name in
# Python: any other distribution shipping a `tools/` top-level collides
# with `bga`'s internals, and pip will happily overwrite files between
# two distributions that both ship it, breaking whichever was installed
# first, silently.
#
# The directory stays `tools/` in the repository and is *installed* as
# `bga._tools`. Nothing else has to move: 55 test imports, 34 CI
# invocations and 263 documented `tools/` paths keep working from a
# checkout exactly as before, and `python3 -m tools.<module>` still
# runs. What made this possible was making the modules' imports of each
# other relative (`from .bst_show_to_graph import ...`), so the package
# does not care which name it is installed under.
package-dir = {"bga._tools" = "tools"}

# Listed rather than discovered: `packages.find` cannot see `bga._tools`,
# because that package's source lives in `tools/` and only the mapping
# above says so. A subpackage added under `bga/` and forgotten here is
# caught by CI's `packaging` job, which installs the built wheel into a
# clean venv and runs every documented alias from an empty directory.
packages = [
    "bga",
    "bga.attribution",
    "bga.diagnostics",
    "bga.floors",
    "bga.graph",
    "bga.ingest",
    "bga.normalize",
    "bga.occupancy",
    "bga.replay",
    "bga.report",
    "bga.structural",
    "bga.utilisation",
    "bga.validation",
    "bga._tools",
    "bga._tools.native_trace",
]

[tool.setuptools.package-data]
# The LD_PRELOAD hook is C source compiled at capture time, not a Python
# module, so it needs naming explicitly or Plane 2 is packaged broken.
"bga._tools.native_trace" = ["*.c", "*.h"]
# UX-193/194/196: the viewer is html, css and ES modules - not Python,
# so setuptools skips it, and `bga view` from an installed wheel served
# a 404 for every asset. Caught by installing the wheel into a clean
# venv, which is the only shape that shows it: from a checkout the
# files are simply there.
"bga" = ["viewer/*.html", "viewer/*.js", "viewer/*.css"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
# Deliberately small, high-value rule set to start (P4-04): pyflakes
# (F) only - unused imports/variables, undefined names, obvious bugs.
# No style/formatting rules (E/W/line-length enforcement) yet - a
# from-scratch strict config on an existing ~30-module codebase risks
# either a wall of unrelated noise or blanket-suppressing everything.
# Widen the rule set in a later, separate task once the team has
# opinions on style rules (line length, quote style, etc.) - see
# docs/backlog/tasks/P4-04-basic-python-linting.md's own scoping note.
select = ["F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# UX-238: so `conftest.py` can import `tiers.py` beside it.
pythonpath = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: full-scale tests (e.g. N=100 determinism runs) not needed on every fast pass",
    # UX-84: the tier that needs a real BuildStream (plus, for two of
    # them, bwrap and a C compiler). Each of these is *also*
    # skipif-gated, so a developer without bst still gets a green
    # `make test` - but a skip is invisible in a pass count, and for a
    # long time no CI job installed bst at all, so the whole tier could
    # rot behind a permanently green CI. The marker is what lets the
    # `bst-tests` job assert the exact number that really ran.
    "bst: requires a real `bst` binary (and sometimes bwrap/cc) on PATH",
    # UX-238: Google's taxonomy, assigned from measured per-file
    # duration in `tests/tiers.py` and applied by a collection hook, so
    # no test file carries one by hand. `bst` above is the enormous
    # tier under the name it already had.
    "small: pure Python over in-memory fixtures - the default tier",
    "medium: spawns a process or a node harness, or writes a run directory",
    "large: builds scale fixtures, streams traces, drives real process trees",
]
