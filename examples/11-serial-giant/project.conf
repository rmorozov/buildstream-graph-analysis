# UX-857: the server's shape. A 40-core server caps one element's
# `max-jobs` at 8 by default - an llvm-sized element alone on the
# critical path idles 32 cores under `off`, and takes the whole pool
# under the mode. `examples/10` cannot show this (four independent
# elements already saturate four cores at `off`); this project is one
# long cmake element (`giant.bst`, 256 generated C files - four times
# 10's 64) with three small leaves waiting on it, `max-jobs: 2` (the
# server's 8-of-40, scaled to this box's four cores).
#
# `max-jobs: 2` lives in `xdg_config_home/` (`build: max-jobs: 2`), not
# a `variables:` key here - BuildStream 2.x rejects an authored
# `max-jobs:` outright as a protected variable (examples/06's own
# project.conf), and UX-377 measured `--max-jobs` on the `bst` command
# line desyncing `bst show`'s own graph (and this project's
# `read_project_max_jobs`, which re-runs `bst show` with no flags
# replayed) from what the sandboxes actually ran. A user-config value
# is the one route both agree on.
#
# generate.sh (files/gen/cmake/) is example 10's own script, hardlink-
# cloned in by stage_cpp_toolchain.sh - not a second copy. Same staged
# sysroot as 05-10 (stage_cpp_toolchain.sh clones it here too).
name: serial-giant-example
min-version: 2.0
element-path: elements

plugins:
- origin: pip
  package-name: buildstream-plugins
  elements:
  - cmake
